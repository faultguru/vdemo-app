const LINK_KINDS = {
  overlap: ["+ OVERLAP", "Another camera recording at the same moment, with matching people / labels / description — the same scene from another angle."],
  continuation: ["⟳ CONTINUATION", "The same camera's next clip within seconds — the camera split one activity into several recordings."],
  transition: ["→ TRANSITION", "Another camera starting shortly after this one stopped, with a matching subject — someone moving from one area to the next."],
  track: ["⌁ TRACK", "The event processor identified the same subject in both events (their track field)."],
};
function activityAnalysis(g) {
  $("#dSub").textContent = `ACTIVITY · ${(g.start || "").replace("T", " ").slice(0, 19)} → ${(g.end || "").slice(11, 19)} · ${g.events.length} clips · ${g.id}`;
  $("#dOrig").style.display = "none";
  $("#drawer").classList.add("open"); $("#shade").classList.add("open"); $("#drawer").scrollTop = 0;
  const ev = id => state.events.get(id)?.e;
  const who = id => { const e = ev(id), t = tparts(e?.recorded_at); return `${t.hm}:${t.s} · ${esc(g.clips[id]?.camera || e?.camera || id)}`; };
  const kinds = [...new Set(g.links.map(l => l.kind))];
  const links = g.links.map(l => `<tr><td>${LINK_KINDS[l.kind]?.[0] || esc(l.kind)}</td><td>${who(l.a)}</td><td>${who(l.b)}</td>
      <td>${l.gap_sec < 0 ? `overlap ${fmtDur(-l.gap_sec)}` : fmtDur(l.gap_sec)}</td>
      <td>${l.score === null ? "—" : `<span class="conf" style="width:${Math.round(l.score * 60)}px"></span>${Math.round(l.score * 100)}%`}</td><td>${esc(l.reason)}</td></tr>`).join("");
  const SRC = { trim: "processed (trimmed) window", original: "whole recording", default: "assumed length (no metadata)" };
  const clips = g.events.map(id => { const c = g.clips[id], e = ev(id);
    return `<tr><td>${who(id)}</td><td>${new Date(c.start_ms).toLocaleTimeString("en-GB", { timeZone: state.cfg.timezone, hour12: false })} – ${new Date(c.end_ms).toLocaleTimeString("en-GB", { timeZone: state.cfg.timezone, hour12: false })}</td>
      <td>${fmtDur((c.end_ms - c.start_ms) / 1000)}</td><td>${esc(SRC[c.window] || c.window)}</td><td>${esc((e?.summary || {}).description || "")}</td></tr>`; }).join("");
  $("#dBody").innerHTML = `
    <div class="sect"><h3>// HOW THIS ACTIVITY WAS STITCHED</h3>
      <p class="explain">Clips are linked by fixed rules — no AI. Each clip has a time window (its activity) and a signature from its description:
      people broken into attributes (colour + garment, hair, type, carried items), labels / actions / vehicles, and the description's words.
      Two clips are compared with score = 60% people + 25% labels/actions/types/vehicles + 15% description words; the same garment in clearly
      different colours, or very different people counts, means no link. Linked clips form one activity (an activity too long is cut at its largest gap).</p>
      <table class="grid"><tr><th>rule</th><th>meaning</th></tr>${kinds.map(k => `<tr><td>${LINK_KINDS[k]?.[0] || esc(k)}</td><td>${esc(LINK_KINDS[k]?.[1] || "")}</td></tr>`).join("")}</table></div>
    <div class="sect"><h3>// LINKS</h3>
      <table class="grid"><tr><th>rule</th><th>from</th><th>to</th><th>gap</th><th>score</th><th>reason</th></tr>${links}</table></div>
    <div class="sect"><h3>// CLIP WINDOWS</h3>
      <p class="explain">The time each clip covers on the activity's clock — what the lane timeline uses; the sequence player plays them in this order.</p>
      <table class="grid"><tr><th>clip</th><th>window</th><th>length</th><th>from</th><th>description</th></tr>${clips}</table></div>
    <div class="sect"><details><summary>// RAW ACTIVITY</summary><pre class="raw">${esc(JSON.stringify(g, null, 2))}</pre></details></div>`;
}

function analysisHTML(e, m) {
  const P = Object.fromEntries((m.processors || []).map(p => [p.name, p]));
  const o = m.original || {}, info = m.info || {}, llm = m.llm || {}, trim = P.trim || {};
  const sec = v => v == null ? "—" : `${(+v).toFixed(1)}s`;
  const ms = v => v == null ? "" : `${(v / 1000).toFixed(1)}s`;
  const res = (ok, txt) => `<div class="res ${ok === true ? "pass" : ok === false ? "fail" : "info"}">${txt || (ok === true ? "✓ PASSED" : ok === false ? "✕ FAILED" : "◇ INFO")}</div>`;
  const segs = m.motion_segments || [];
  const dur = +info.duration_sec || +trim.duration_sec || 1;
  const origDur = +o.duration_sec || dur;
  const motionSec = segs.reduce((a, s) => a + (+s.duration_sec || 0), 0);
  const yoloDet = segs.flatMap(s => (s.detections || []).map(d => ({ ...d, seg: s.index })));
  const u = llm.usage || {};
  const stages = [
    { n: "00", t: "PROVIDER", ok: null, r: (o.provider_detections || []).length ? "◇ " + o.provider_detections.join(", ").toUpperCase() : "◇ NO LABELS",
      kv: [["source", o.provider], ["trigger", o.trigger], ["length", sec(o.duration_sec)]] },
    { n: "01", t: "TRIAGE", ok: P.triage?.passed, kv: [["changed", P.triage ? `${(P.triage.changed_ratio * 100).toFixed(2)}%` : "—"], ["threshold", P.triage ? `${(P.triage.threshold * 100).toFixed(2)}%` : "—"], ["time", ms(P.triage?.duration_ms)]] },
    { n: "02", t: "OPENCV", ok: segs.length > 0, r: segs.length ? `✓ ${segs.length} SEGMENT${segs.length > 1 ? "S" : ""}` : "✕ NO MOTION",
      kv: [["motion", sec(motionSec)], ["peak area", segs.length ? `${(Math.max(...segs.map(s => +s.peak_area_ratio || 0)) * 100).toFixed(1)}%` : "—"], ["time", ms(P.opencv?.duration_ms)]] },
    { n: "03", t: "YOLO", ok: P.yolo?.passed, kv: [["model", P.yolo?.model], ["found", (P.yolo?.classes_detected || []).join(", ") || "nothing"], ["required", (P.yolo?.required_classes || []).join(", ") || "any"]] },
    { n: "04", t: "TRIM", ok: null, r: trim.focus ? `◇ FOCUS: ${String(trim.focus).toUpperCase()}` : "◇ FULL CLIP",
      kv: [["kept", `${sec(trim.duration_sec)} / ${sec(origDur)}`], ["cut head", sec(trim.removed_head_sec)], ["cut tail", sec(trim.removed_tail_sec)]] },
    { n: "05", t: "DESCRIBE", ok: llm.summary ? !llm.summary.ignore || sev(e) !== "none" : null, r: llm.summary ? (llm.summary.ignore && sev(e) === "none" ? "✕ NOT IMPORTANT" : "✓ IMPORTANT") : "◇ NOT RUN",
      kv: [["model", llm.model], ["frames", llm.frames_sent], ["tokens", u.input_tokens != null ? `${u.input_tokens} in / ${u.output_tokens} out` : "—"], ["time", ms(llm.duration_ms)]] },
  ];
  // A stage that did not run (no record of it): SKIPPED, with why — the security mode, or an earlier stage failing.
  const ran = { "01": P.triage, "02": P.opencv, "03": P.yolo, "04": P.trim, "05": P.llm || llm.summary };
  let stopped = null;
  stages.forEach(s => {
    if (s.n in ran && !ran[s.n]) {
      s.skipped = m.fast ? "security mode HOME: saved without analysis" : stopped ? `stage ${stopped} failed` : "not run";
    } else if (s.ok === false && !stopped) stopped = s.n;
  });
  const flow = stages.map(s => s.skipped
    ? `<div class="stage cut skipped"><div class="sn">STAGE ${s.n}</div><div class="st">${s.t}</div><div class="res skipped">⏭ SKIPPED</div>
      <div class="kv">${esc(s.skipped)}</div></div>`
    : `<div class="stage cut ${s.ok === true ? "pass" : s.ok === false ? "fail" : ""}"><div class="sn">STAGE ${s.n}</div><div class="st">${s.t}</div>${res(s.ok, s.r)}
      <div class="kv">${s.kv.map(([k, v]) => `${k}: <b>${esc(v ?? "—")}</b>`).join("<br>")}</div></div>`).join("");

  const pct = (v, d) => `${Math.max(0, Math.min(100, v / d * 100))}%`;
  const segBars = segs.map(s => `<div class="seg" style="left:${pct(s.start_sec, dur)};width:${pct(s.end_sec - s.start_sec, dur)}" title="segment ${s.index}: ${(+s.start_sec).toFixed(1)}–${(+s.end_sec).toFixed(1)}s"></div>`).join("");
  const imp = (llm.important_frames_sec || []).map(t => `<div class="tick" style="left:${pct(t, dur)}" title="important frame ${t}s"></div>`).join("");
  const thm = llm.thumbnail_sec >= 0 ? `<div class="thumbmark" style="left:${pct(llm.thumbnail_sec, dur)}" title="thumbnail ${llm.thumbnail_sec}s"></div>` : "";
  const keep = `<div class="keep" style="left:${pct(trim.offset_sec || 0, origDur)};width:${pct(trim.duration_sec || origDur, origDur)}" title="kept window"></div>`;

  const segRows = segs.map(s => `<tr><td>#${s.index}</td><td>${(+s.start_sec).toFixed(2)} – ${(+s.end_sec).toFixed(2)}s</td><td>${((+s.peak_area_ratio || 0) * 100).toFixed(2)}%</td>
      <td>${(s.detections || []).map(d => `<div><span class="conf" style="width:${Math.round((d.confidence || 0) * 60)}px"></span>${esc(d.class)} ${((d.confidence || 0) * 100).toFixed(0)}%</div>`).join("") || '<span style="color:var(--faint)">—</span>'}</td></tr>`).join("");
  const llmEvents = (llm.events || []).filter(x => x.object !== "noise").map(x => `<tr><td>#${x.segment_index}</td><td>${esc(x.object)}</td><td>${esc(x.details)}</td><td>${esc(x.description)}</td></tr>`).join("");
  const thr = (llm.summary || {}).threat || {};

  return `
    <div class="sect"><h3>// FILTER PIPELINE</h3>
      <p class="explain">Each clip runs through these stages in order; a failed check stops the pipeline (the clip is ignored, no event). Triage compares sampled frames for any change, OpenCV isolates motion segments, YOLO confirms a required object (a person) is moving, the trim keeps only the active part, and the LLM describes the result and judges its importance.</p>
      <div class="flow">${flow}</div></div>
    <div class="sect"><h3>// ORIGINAL CLIP · KEPT WINDOW</h3>
      <p class="explain">The full ${sec(origDur)} recording from the camera; the outlined window is the part kept in the processed video.</p>
      <div class="timeline">${keep}</div><div class="scale"><span>0s</span><span>${sec(origDur / 2)}</span><span>${sec(origDur)}</span></div></div>
    <div class="sect"><h3>// PROCESSED CLIP · MOTION MAP</h3>
      <p class="explain">The processed clip's ${sec(dur)} timeline (${info.width || "?"}×${info.height || "?"} @ ${info.fps ? (+info.fps).toFixed(1) : "?"} fps): motion segments found by OpenCV, the frames the LLM marked important and the thumbnail moment.</p>
      <div class="timeline">${segBars}${imp}${thm}</div><div class="scale"><span>0s</span><span>${sec(dur / 2)}</span><span>${sec(dur)}</span></div>
      <div class="legend"><span><i style="background:var(--cyan)"></i>motion segment</span><span><i style="background:var(--amber)"></i>important frame</span><span><i style="background:#fff"></i>thumbnail</span></div></div>
    <div class="sect"><h3>// MOTION SEGMENTS · YOLO DETECTIONS</h3>
      ${segs.length ? `<table class="grid"><tr><th>seg</th><th>time</th><th>peak area</th><th>detections</th></tr>${segRows}</table>` : '<p class="explain">No motion segments.</p>'}
      ${yoloDet.length ? "" : '<p class="explain">YOLO found no objects in the motion.</p>'}</div>
    ${thr.level && thr.level !== "none" ? `<div class="sect"><h3 style="color:var(--red)">// THREAT ASSESSMENT · ${esc(thr.level).toUpperCase()}</h3>
      <div class="threatline ${esc(thr.level)}">${esc(thr.evidence)}</div><div class="tags">${(thr.signals || []).map(x => `<span class="tag label">!${esc(x)}</span>`).join("")}</div></div>` : ""}
    <div class="sect"><h3>// LLM OBSERVATIONS</h3>
      <p class="explain">${esc((llm.summary || {}).description || "No description.")}</p>
      ${llmEvents ? `<table class="grid"><tr><th>seg</th><th>object</th><th>details</th><th>what happens</th></tr>${llmEvents}</table>` : ""}</div>
    <div class="sect"><details><summary>// RAW METADATA</summary><pre class="raw">${esc(JSON.stringify(m, null, 2))}</pre></details></div>`;
}

// ---------- AI analyst chat ----------
const chat = { focus: null, detached: false, files: [], busy: false, lookback: 14 };
function syncFocus() { chat.focus = chat.detached ? null : state.date; renderScope(); }
function renderScope() {
  const s = $("#scope");
  if (chat.focus) {
    s.innerHTML = `<span>SCOPE</span><span class="focus">◉ ${esc(chat.focus)}${chat.focus === state.cfg?.today ? " · TODAY" : ""}<button title="Detach from this day — ask about the last ${chat.lookback} days">✕</button></span>`;
    s.querySelector("button").onclick = () => { chat.detached = true; syncFocus(); };
  } else {
    s.innerHTML = `<span>SCOPE</span><span class="focus off">◎ LAST ${chat.lookback} DAYS</span>
      ${state.date ? `<button class="attach-day">⊕ FOCUS ${esc(state.date)}</button>` : ""}`;
    s.querySelector(".attach-day")?.addEventListener("click", () => { chat.detached = false; syncFocus(); });
  }
  if (typeof mon !== "undefined" && monActive() && monSelected().length)
    s.insertAdjacentHTML("beforeend", `<span class="focus livefocus" title="The analyst also sees the latest snapshots of these cameras">&#9679; LIVE · ${monSelected().length} CAM${monSelected().length > 1 ? "S" : ""}</span>`);
}
function fmt(text) {
  const lines = esc(text).replace(/\*\*(.+?)\*\*/g, "<b>$1</b>").split("\n");
  let html = "", list = false;
  for (const l of lines) {
    const m = /^\s*[-•*]\s+(.*)/.exec(l);
    if (m) { if (!list) { html += "<ul>"; list = true; } html += `<li>${m[1]}</li>`; continue; }
    if (list) { html += "</ul>"; list = false; }
    html += l + "<br>";
  }
  return (list ? html + "</ul>" : html).replace(/(<br>)+$/, "");
}
function mediaHTML(items) {
  if (!items || !items.length) return "";
  return `<div class="media">${items.map(it => {
    if (!it.path && !it.localUrl) return `<div class="cap">${it.kind === "video" ? "▶" : "▣"} ${esc(it.name || it.kind)} (not stored)</div>`;
    const url = it.localUrl || media(it.path);
    const body = it.kind === "video"
      ? `<video controls playsinline preload="metadata" src="${url}"></video>`
      : `<img loading="lazy" src="${url}" alt="" data-zoom="${url}">`;
    return `<div>${body}${it.caption ? `<div class="cap">${esc(it.caption)}</div>` : ""}</div>`;
  }).join("")}</div>`;
}
function addMsg(m, { err = false } = {}) {
  const el = document.createElement("div");
  el.className = `msg ${m.role === "user" ? "user" : "agent"}${err ? " err" : ""}`;
  const at = (m.at || "").slice(11, 16);
  const who = m.role === "user" ? `YOU${m.date ? " · " + m.date : " · LAST " + chat.lookback + "D"}${(m.live || []).length ? " · LIVE" : ""}` : "ANALYST";
  const text = m.text && m.text !== "(sent without text)" ? fmt(m.text) : "";
  el.innerHTML = `<div class="meta">${who}${at ? " · " + at : ""}</div>
    ${text || !(m.media || []).length ? `<div class="bub">${text || '<span style="color:var(--faint)">(no text — media sent)</span>'}</div>` : ""}
    ${mediaHTML(m.media)}`;
  el.querySelectorAll("[data-zoom]").forEach(i => i.onclick = () => { $("#lightbox img").src = i.dataset.zoom; $("#lightbox").classList.add("open"); });
  $("#msgs").appendChild(el);
  $("#msgs").scrollTop = $("#msgs").scrollHeight;
  return el;
}
function renderFiles() {
  $("#files").innerHTML = chat.files.map((f, i) => `<span>${f.type.startsWith("video") ? "▶" : "▣"} ${esc(f.name)} <button data-i="${i}">✕</button></span>`).join("");
  $("#files").querySelectorAll("button").forEach(b => b.onclick = () => { chat.files.splice(+b.dataset.i, 1); renderFiles(); });
}
function addFiles(list) {
  for (const f of list) if (/^(image|video)\//.test(f.type)) chat.files.push(f);
  renderFiles();
}
async function sendChat() {
  const text = $("#ask").value.trim();
  if (chat.busy || (!text && !chat.files.length)) return;
  chat.busy = true; $("#send").disabled = true; $("#core").classList.add("busy");
  const fd = new FormData();
  fd.append("text", text);
  if (chat.focus) fd.append("date", chat.focus);
  const live = monActive() ? monSelected() : [];
  if (live.length) fd.append("live", live.join("\n"));  // the analyst gets their latest snapshots
  chat.files.forEach(f => fd.append("files", f, f.name));
  // The user's files are shown from the browser (local previews); the server never stores them.
  addMsg({ role: "user", text: text || "(sent without text)", date: chat.focus, live,
    media: chat.files.map(f => ({ kind: f.type.startsWith("video") ? "video" : "photo", localUrl: URL.createObjectURL(f) })) });
  $("#ask").value = ""; autosize(); chat.files = []; renderFiles();
  const typing = document.createElement("div");
  typing.className = "msg agent typing"; typing.innerHTML = '<div class="meta">ANALYST</div><div class="bub"><i></i><i></i><i></i>&nbsp;ANALYZING</div>';
  $("#msgs").appendChild(typing); $("#msgs").scrollTop = $("#msgs").scrollHeight;
  try {
    const r = await fetch("/api/chat", { method: "POST", body: fd });
    if (!r.ok) throw new Error(await r.text() || r.status);
    const d = await r.json();
    typing.remove();
    addMsg(d.agent);
  } catch (err) {
    typing.remove();
    addMsg({ role: "agent", text: "Link error: " + err.message }, { err: true });
  } finally {
    chat.busy = false; $("#send").disabled = false; $("#core").classList.remove("busy"); $("#ask").focus();
  }
}
function autosize() { const t = $("#ask"); t.style.height = "auto"; t.style.height = Math.min(160, t.scrollHeight) + "px"; }
async function loadChat() {
  try {
    const d = await api("/api/chat");
    chat.lookback = d.lookback_days || 14;
    $("#msgs").innerHTML = "";
    if (!d.messages.length) $("#msgs").innerHTML = `<div class="hello">Ask the <b>analyst</b> about what the cameras saw — on the selected day, or over the last <b>${chat.lookback} days</b> once you detach it (✕). It can send pictures and videos of events, and look at pictures or videos you attach.<br><br>It knows the household's <b>long-term memory</b> from the Telegram bot but can't change it, and this conversation isn't saved.</div>`;
    d.messages.forEach(m => addMsg(m));
    renderScope();
  } catch { /* backend not up yet: the boot loop retries */ }
}
function setChat(open) {
  $("#shell").classList.toggle("nochat", !open);
  if (typeof mon !== "undefined") requestAnimationFrame(monFit);
  try { localStorage.setItem("sentinel.chat", open ? "1" : "0"); } catch { /* storage unavailable */ }
}
$("#chatHide").onclick = () => setChat(false);
$("#chatClear").onclick = async () => {
  if (chat.busy) return;
  try { await fetch("/api/chat/clear", { method: "POST" }); } catch { /* shown as a link error on the next message */ }
  loadChat();
};
$("#chatShow").onclick = () => setChat(true);
$("#send").onclick = sendChat;
$("#attach").onclick = () => $("#fileIn").click();
$("#fileIn").onchange = ev => { addFiles(ev.target.files); ev.target.value = ""; };
$("#ask").addEventListener("keydown", ev => { if (ev.key === "Enter" && !ev.shiftKey) { ev.preventDefault(); sendChat(); } });
$("#ask").addEventListener("input", autosize);
$("#chat").addEventListener("dragover", ev => { ev.preventDefault(); });
$("#chat").addEventListener("drop", ev => { ev.preventDefault(); addFiles(ev.dataTransfer.files); });
$("#ask").addEventListener("paste", ev => addFiles([...(ev.clipboardData?.files || [])]));
$("#lightbox").onclick = () => $("#lightbox").classList.remove("open");
try { if (localStorage.getItem("sentinel.chat") === "0") setChat(false); } catch { /* storage unavailable */ }

// ---------- live monitor ----------
// The selected cameras on screen, fitted to it: a fresh provider snapshot of each
// as often as the provider allows (the status poll is the server's heartbeat — no
// poll, no snapshots), and each camera's true live view (MJPEG). In LIVE
// STREAM mode (the default) every tile streams and reconnects when the provider ends
// the stream; snapshots show meanwhile. The server keeps the snapshots so the
// analyst can answer questions about them. On/off, the mode and the camera
// selection are remembered (all cameras by default).
const mon = { want: false, mode: "live", cams: null, off: new Set(), tiles: new Map(), timer: null, solo: null };
const monActive = () => mon.want && state.mode === "live";
const monSelected = () => (mon.cams || []).filter(c => !mon.off.has(c));
function monSave() {
  try {
    localStorage.setItem("sentinel.monitor", mon.want ? "1" : "0");
    localStorage.setItem("sentinel.monitorOff", JSON.stringify([...mon.off]));
    localStorage.setItem("sentinel.monitorMode", mon.mode);
  } catch { /* storage unavailable */ }
}
function setMode(mode) {
  mon.mode = mode; monSave();
  $("#tMode").textContent = mode === "live" ? "LIVE STREAM" : "SNAPSHOTS";
  $("#tMode").classList.toggle("on", mode === "live");
  mon.tiles.forEach(t => { t.manualOff = false; t.retryAt = 0; if (mode !== "live") stopLive(t); });
  autoLive();
}
function autoLive() {  // LIVE STREAM mode: (re)start the tiles' streams that are due
  if (mon.mode !== "live" || !monActive() || document.hidden) return;
  mon.tiles.forEach(t => { if (!t.live && !t.manualOff && Date.now() >= (t.retryAt || 0)) startLive(t); });
}
function setMonitor(on) {
  mon.want = on; monSave();
  if (on && state.mode !== "live") { go(null); return; }  // open() applies it
  applyMonitor();
  window.scrollTo({ top: 0 });
}
function applyMonitor() {
  const on = monActive();
  document.body.classList.toggle("monitoring", on);
  $("#tLive").classList.toggle("on", on);
  $("#liveBtn").classList.toggle("on", state.mode === "live" && !on);
  clearInterval(mon.timer); mon.timer = null;
  if (!on) mon.tiles.forEach(t => stopLive(t));
  renderScope();
  if (on) monStart();
}
async function monStart() {
  if (!mon.cams) {
    $("#monitor").innerHTML = '<div class="loading">CONNECTING TO CAMERAS</div>';
    try {
      const r = await fetch("/api/live/cameras", { cache: "no-store" });
      if (!r.ok) throw new Error(await r.text() || r.status);
      mon.cams = (await r.json()).cameras;
    } catch (err) {
      $("#monitor").innerHTML = `<div class="empty">CAMERAS UNAVAILABLE — RETRYING<br><br>${esc(err.message)}</div>`;
      setTimeout(() => { if (monActive() && !mon.cams) monStart(); }, 10000);
      return;
    }
  }
  if (!monActive() || mon.timer) return;
  renderCamChips(); buildTiles(); renderScope(); monPoll(); autoLive();
  mon.timer = setInterval(monPoll, 2000);
}
function renderCamChips() {
  const all = monSelected().length === mon.cams.length;
  $("#camChips").innerHTML = `<button class="camchip all" data-all title="Select every camera">ALL</button>`
    + mon.cams.map(c => `<button class="camchip ${mon.off.has(c) ? "" : "on"}" data-cam="${esc(c)}">${esc(c)}</button>`).join("");
  $("#camChips").querySelector("[data-all]").disabled = all;
  $("#camChips").querySelectorAll("[data-cam]").forEach(b => b.onclick = () => {
    const c = b.dataset.cam;
    mon.off.has(c) ? mon.off.delete(c) : mon.off.add(c);
    monSave(); renderCamChips(); buildTiles(); monPoll(); renderScope(); autoLive();
  });
  $("#camChips").querySelector("[data-all]").onclick = () => { mon.off.clear(); monSave(); renderCamChips(); buildTiles(); monPoll(); renderScope(); autoLive(); };
}
function buildTiles() {
  const box = $("#monitor"), sel = monSelected();
  box.querySelectorAll(":scope > :not(.tile)").forEach(el => el.remove());
  for (const [c, t] of mon.tiles) if (!sel.includes(c)) { stopLive(t); t.el.remove(); mon.tiles.delete(c); }
  if (mon.solo && !sel.includes(mon.solo)) mon.solo = null;
  for (const c of sel) {
    let t = mon.tiles.get(c);
    if (!t) { t = makeTile(c); mon.tiles.set(c, t); }
    box.appendChild(t.el);  // keeps the cameras' order
  }
  if (!sel.length) box.innerHTML = '<div class="empty">NO CAMERA SELECTED</div>';
  monFit();
}
function makeTile(cam) {
  const el = document.createElement("div");
  el.className = "tile cut";
  el.innerHTML = `<img class="snap" alt="">
    <div class="tmsg">AWAITING SNAPSHOT</div>
    <div class="tbar"><span class="tname">${esc(cam)}</span><span class="tmode">SNAPSHOT</span><span class="tage"></span>
      <button class="tbtn golive" data-live title="True live view (video stream from the camera)">&#9679; LIVE</button>
      <button class="tbtn" data-solo title="Fill the screen with this camera">&#10530;</button></div>
    <span class="corner tl"></span><span class="corner tr"></span><span class="corner bl"></span><span class="corner br"></span>
    <div class="terr"></div>`;
  const t = { cam, el, img: el.querySelector("img"), live: false, liveSince: 0, path: null, at: null, manualOff: false, retryAt: 0 };
  t.img.style.display = "none";
  // in LIVE STREAM mode, a stream stopped by hand stays off until started again or the mode changes
  el.querySelector("[data-live]").onclick = () => {
    if (t.live) { t.manualOff = true; stopLive(t); } else { t.manualOff = false; startLive(t); }
  };
  el.querySelector("[data-solo]").onclick = () => solo(t.cam);
  el.ondblclick = ev => { if (!ev.target.closest("button")) solo(t.cam); };
  t.img.onclick = () => { if (t.live) return; $("#lightbox img").src = t.img.src; $("#lightbox").classList.add("open"); };
  return t;
}
function solo(cam) {
  mon.solo = mon.solo === cam ? null : cam;
  mon.tiles.forEach(t => t.el.querySelector("[data-solo]").innerHTML = mon.solo ? "&#10529;" : "&#10530;");
  monFit();
}
function tileError(t, msg) {
  const e = t.el.querySelector(".terr");
  e.textContent = msg || ""; e.classList.toggle("show", !!msg);
}
function tileMsg(t, msg) {
  const m = t.el.querySelector(".tmsg");
  m.textContent = msg || ""; m.style.display = msg ? "" : "none";
}
async function monPoll() {
  if (!monActive() || document.hidden) return;  // no heartbeat while nobody looks: the server stops snapping
  const sel = monSelected();
  if (!sel.length) return;
  let d;
  try { d = await api("/api/live/status?" + sel.map(c => "cam=" + encodeURIComponent(c)).join("&")); setLink(true); }
  catch { setLink(false); return; }
  for (const c of sel) {
    const t = mon.tiles.get(c), info = d.cameras[c] || {};
    if (!t) continue;
    t.at = info.at || t.at;
    if (t.live) {
      if (!info.live && Date.now() - t.liveSince > 15000)
        stopLive(t, mon.mode === "live" ? "Live view ended — reconnecting" : "Live view ended — showing snapshots again");
      continue;
    }
    tileError(t, info.error && !t.path ? info.error : (info.error ? "Latest snapshot failed: " + info.error : ""));
    if (info.path && info.path !== t.path) {
      const im = new Image(), path = info.path;
      im.onload = () => { if (t.live) return; t.img.src = im.src; t.img.style.display = ""; t.path = path; tileMsg(t, ""); };
      im.src = media(path);
    } else if (!info.path && !t.path) tileMsg(t, d.connected ? "AWAITING SNAPSHOT" : "CONNECTING TO CAMERAS");
  }
  autoLive();
}
function startLive(t) {
  t.live = true; t.liveSince = Date.now();
  t.el.classList.add("live");
  t.el.querySelector(".tmode").textContent = "LIVE";
  t.el.querySelector("[data-live]").innerHTML = "&#9632; STOP";
  tileError(t, ""); tileMsg(t, "STARTING LIVE VIEW");
  t.img.onload = () => { t.img.style.display = ""; tileMsg(t, ""); };
  t.img.onerror = () => stopLive(t, "Live view unavailable" + (Date.now() - t.liveSince > 15000 ? " (stream ended)" : ""));
  t.img.src = `/api/live/stream/${encodeURIComponent(t.cam)}?t=${Date.now()}`;
}
function stopLive(t, msg) {
  if (!t.live) return;
  t.live = false;
  t.img.onload = t.img.onerror = null;
  t.el.classList.remove("live");
  t.el.querySelector(".tmode").textContent = "SNAPSHOT";
  t.el.querySelector("[data-live]").innerHTML = "&#9679; LIVE";
  if (t.path) { t.img.src = media(t.path); tileMsg(t, ""); }
  else { t.img.removeAttribute("src"); t.img.style.display = "none"; tileMsg(t, "AWAITING SNAPSHOT"); }
  if (msg) {  // ended or failed: in LIVE STREAM mode, retry soon after a stream that ran, later after a failure
    t.retryAt = Date.now() + (Date.now() - t.liveSince > 15000 ? 2000 : 30000);
    tileError(t, msg); setTimeout(() => { if (!t.live) tileError(t, ""); }, 8000);
  }
}
function monFit() {
  if (!monActive()) return;
  const box = $("#monitor");
  mon.tiles.forEach(t => t.el.classList.toggle("solo-hidden", !!mon.solo && t.cam !== mon.solo));
  const n = mon.solo ? 1 : mon.tiles.size;
  if (!n) return;
  const full = document.fullscreenElement === box;
  const gap = 10, W = box.clientWidth - (full ? 20 : 0);
  const H = full ? window.innerHeight - 20
    : Math.max(240, window.innerHeight - (box.getBoundingClientRect().top + window.scrollY) - 14);
  let best = { w: 0, cols: 1 };
  for (let cols = 1; cols <= n; cols++) {  // the column count that gives the largest 16:9 tiles
    const rows = Math.ceil(n / cols);
    const w = Math.min((W - gap * (cols - 1)) / cols, (H - gap * (rows - 1)) / rows * 16 / 9);
    if (w > best.w) best = { w, cols };
  }
  box.style.gridTemplateColumns = `repeat(${best.cols}, ${Math.floor(best.w)}px)`;
}
function tileAge(at) {
  const t = Date.parse(at); if (isNaN(t)) return "";
  const d = Math.max(0, Math.round((Date.now() - t) / 1000));
  return d < 90 ? `${d}s ago` : d < 5400 ? `${Math.round(d / 60)} min ago` : `${Math.round(d / 3600)} h ago`;
}
setInterval(() => mon.tiles.forEach(t => {
  const a = t.el.querySelector(".tage");
  a.textContent = t.live ? "" : tileAge(t.at);
  a.classList.toggle("stale", !t.live && Date.now() - Date.parse(t.at) > 60000);
}), 1000);
window.addEventListener("resize", monFit);
new ResizeObserver(monFit).observe($("#monitor"));
document.addEventListener("visibilitychange", () => {  // no streams for a hidden tab; back when it shows
  if (document.hidden) mon.tiles.forEach(t => { stopLive(t); t.retryAt = 0; });
  else monPoll();
});
$("#tMode").onclick = () => setMode(mon.mode === "live" ? "snap" : "live");
$("#tFull").onclick = () => { $("#monitor").requestFullscreen?.().catch(err => toast("FULL SCREEN UNAVAILABLE: " + err.message)); };
document.addEventListener("fullscreenchange", () => requestAnimationFrame(monFit));
document.addEventListener("keydown", ev => {
  if (ev.key === "Escape" && mon.solo && !$("#player").classList.contains("open") && !$("#drawer").classList.contains("open")) solo(mon.solo);
});
$("#tLive").onclick = () => { if (!monActive()) setMonitor(true); };

// ---------- controls ----------
$("#liveBtn").onclick = () => { if (mon.want) setMonitor(false); go(null); };
$("#datePick").onchange = ev => ev.target.value && go(ev.target.value);
$("#camSel").onchange = ev => { state.filters.cam = ev.target.value; applyFilters(); };
$("#search").oninput = ev => { state.filters.q = ev.target.value.trim(); applyFilters(); };
$("#tThreat").onclick = ev => { state.filters.threat = !state.filters.threat; ev.target.classList.toggle("on", state.filters.threat); applyFilters(); };
$("#tSent").onclick = ev => { state.filters.sent = !state.filters.sent; ev.target.classList.toggle("on", state.filters.sent); applyFilters(); };
$("#tAuto").onclick = () => { setAuto(!state.auto); if (state.auto) scrollTop(true); };
$("#tStitch").onclick = () => {
  state.stitch = !state.stitch; $("#tStitch").classList.toggle("on", state.stitch);
  try { localStorage.setItem("sentinel.stitch", state.stitch ? "1" : "0"); } catch { /* storage unavailable */ }
  layout(true);
};

// ---------- security mode ----------
function showSecurityMode(d) {
  const sel = $("#secSel"), st = d.state;
  if (!sel.options.length) sel.innerHTML = d.modes.map(m => `<option value="${esc(m.value)}">${esc(m.label.toUpperCase())}</option>`).join("");
  sel.value = st.mode;
  $("#secmode").className = "secmode " + st.mode;
  const hm = iso => (iso || "").slice(11, 16);
  $("#secInfo").textContent = st.until ? `until ${hm(st.until)}` : st.mode !== "normal" && st.since ? `since ${hm(st.since)}` : "";
}
async function loadSecurityMode() {
  try { showSecurityMode(await api("/api/security-mode")); } catch { /* backend unreachable: keep what is shown */ }
}
$("#secSel").onchange = async ev => {
  const r = await fetch("/api/security-mode", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ mode: ev.target.value }) });
  if (r.ok) showSecurityMode(await r.json()); else loadSecurityMode();
};

// ---------- boot ----------
(async function boot() {
  for (;;) {
    try { state.cfg = await api("/api/config"); setLink(true); break; }
    catch { setLink(false); $("#feed").innerHTML = '<div class="empty">BACKEND UNREACHABLE — RETRYING</div>'; await new Promise(r => setTimeout(r, 3000)); }
  }
  tick();
  try { if (localStorage.getItem("sentinel.stitch") === "0") state.stitch = false; } catch { /* storage unavailable */ }
  if (!state.cfg.stitch) { state.stitch = false; $("#tStitch").style.display = "none"; }
  $("#tStitch").classList.toggle("on", state.stitch);
  try {
    mon.want = localStorage.getItem("sentinel.monitor") === "1";
    mon.off = new Set(JSON.parse(localStorage.getItem("sentinel.monitorOff") || "[]"));
    if (localStorage.getItem("sentinel.monitorMode") === "snap") mon.mode = "snap";
  } catch { /* storage unavailable */ }
  $("#tMode").textContent = mon.mode === "live" ? "LIVE STREAM" : "SNAPSHOTS";
  $("#tMode").classList.toggle("on", mon.mode === "live");
  await Promise.all([loadDays(), loadChat(), loadSecurityMode()]);
  state.daysTimer = setInterval(loadDays, 30000);
  setInterval(loadSecurityMode, 30000);  // HOME ends on its own; Telegram can change the mode too
  route();
})();
</script>
</body>
</html>
