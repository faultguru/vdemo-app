<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sentinel Console</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #04060c;
  --bg2: #070b16;
  --panel: rgba(12, 22, 40, .72);
  --panel-solid: #0b1426;
  --line: rgba(0, 229, 255, .18);
  --line-strong: rgba(0, 229, 255, .45);
  --text: #d7e7ff;
  --dim: #7d93b5;
  --faint: #47597a;
  --cyan: #00e5ff;
  --magenta: #ff2bd6;
  --violet: #8b5cff;
  --green: #26ffa0;
  --amber: #ffb020;
  --red: #ff3b5c;
  --glow-cyan: 0 0 12px rgba(0, 229, 255, .55), 0 0 32px rgba(0, 229, 255, .18);
  --glow-red: 0 0 14px rgba(255, 59, 92, .7), 0 0 40px rgba(255, 59, 92, .25);
  --head: "Orbitron", "Segoe UI", sans-serif;
  --body: "Rajdhani", "Segoe UI", sans-serif;
  --mono: "JetBrains Mono", Consolas, monospace;
  --cut: 14px;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  background: var(--bg);
  color: var(--text);
  font: 500 16px/1.4 var(--body);
  overflow-x: hidden;
}
/* ---------- backdrop: grid, glows, scanlines ---------- */
.backdrop { position: fixed; inset: 0; z-index: -2; overflow: hidden;
  background:
    radial-gradient(900px 600px at 12% -10%, rgba(0, 229, 255, .13), transparent 60%),
    radial-gradient(800px 600px at 110% 10%, rgba(255, 43, 214, .10), transparent 60%),
    radial-gradient(900px 700px at 50% 120%, rgba(139, 92, 255, .12), transparent 60%),
    linear-gradient(180deg, var(--bg2), var(--bg)); }
.backdrop::before { content: ""; position: absolute; inset: -50%;
  background-image:
    linear-gradient(rgba(0, 229, 255, .07) 1px, transparent 1px),
    linear-gradient(90deg, rgba(0, 229, 255, .07) 1px, transparent 1px);
  background-size: 48px 48px;
  transform: perspective(900px) rotateX(58deg) translateY(-8%);
  animation: gridmove 18s linear infinite; mask-image: linear-gradient(180deg, transparent 30%, #000 75%); }
@keyframes gridmove { to { background-position: 0 480px, 0 0; } }
.scan { position: fixed; inset: 0; z-index: 50; pointer-events: none;
  background: repeating-linear-gradient(180deg, rgba(255,255,255,.025) 0 1px, transparent 1px 3px); mix-blend-mode: overlay; }
.scan::after { content: ""; position: absolute; left: 0; right: 0; height: 140px; top: -140px;
  background: linear-gradient(180deg, transparent, rgba(0, 229, 255, .06), transparent);
  animation: sweep 7s linear infinite; }
@keyframes sweep { to { top: 100%; } }

/* ---------- frame ---------- */
.wrap { max-width: 1500px; margin: 0 auto; padding: 18px 22px 120px; }
.cut { clip-path: polygon(var(--cut) 0, 100% 0, 100% calc(100% - var(--cut)), calc(100% - var(--cut)) 100%, 0 100%, 0 var(--cut)); }
.panel { background: var(--panel); border: 1px solid var(--line); backdrop-filter: blur(10px); position: relative; }

/* ---------- header ---------- */
header { display: flex; align-items: center; gap: 22px; padding: 14px 20px; margin-bottom: 14px; }
header::after { content: ""; position: absolute; left: 0; right: 0; bottom: -1px; height: 2px;
  background: linear-gradient(90deg, transparent, var(--cyan), var(--magenta), transparent); opacity: .7; }
.logo { display: flex; align-items: center; gap: 14px; }
.hex { width: 44px; height: 44px; filter: drop-shadow(0 0 8px rgba(0,229,255,.7)); }
.hex .ring { transform-origin: 50% 50%; animation: spin 9s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.brand { font: 900 22px/1 var(--head); letter-spacing: .32em; color: #fff; text-shadow: var(--glow-cyan); }
.brand small { display: block; margin-top: 6px; font: 600 11px/1 var(--mono); letter-spacing: .28em; color: var(--dim); text-shadow: none; }
.hud-right { margin-left: auto; display: flex; align-items: center; gap: 18px; }
.clock { font: 700 26px/1 var(--mono); color: #fff; letter-spacing: .06em; text-shadow: var(--glow-cyan); text-align: right; }
.clock small { display: block; font: 500 11px/1.6 var(--mono); color: var(--dim); letter-spacing: .2em; }
.mode { font: 700 12px/1 var(--head); letter-spacing: .25em; padding: 10px 14px; border: 1px solid var(--line-strong); color: var(--cyan); }
.mode.live { color: var(--red); border-color: rgba(255, 59, 92, .6); box-shadow: var(--glow-red); }
.mode.live::before { content: ""; display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 9px;
  background: var(--red); box-shadow: 0 0 10px var(--red); animation: blink 1.2s infinite; vertical-align: 1px; }
@keyframes blink { 50% { opacity: .2; } }
.link-dot { width: 10px; height: 10px; border-radius: 50%; background: var(--green); box-shadow: 0 0 10px var(--green); }
.link-dot.down { background: var(--red); box-shadow: 0 0 10px var(--red); }

/* ---------- day selector ---------- */
.days { display: flex; align-items: stretch; gap: 10px; padding: 12px; margin-bottom: 14px; }
.live-btn { flex: none; cursor: pointer; border: 1px solid rgba(255,59,92,.55); background: linear-gradient(135deg, rgba(255,59,92,.18), rgba(255,43,214,.08));
  color: #fff; font: 900 13px/1 var(--head); letter-spacing: .24em; padding: 0 18px; }
.live-btn:not(.on) { opacity: .55; }
.live-btn:not(.on):hover { opacity: .85; }
.live-btn.on { box-shadow: var(--glow-red); background: linear-gradient(135deg, rgba(255,59,92,.42), rgba(255,43,214,.2)); }
.chips { display: flex; gap: 8px; overflow-x: auto; flex: 1; scrollbar-width: thin; scrollbar-color: var(--line-strong) transparent; padding-bottom: 2px; }
.chip { flex: none; cursor: pointer; min-width: 104px; padding: 8px 12px; border: 1px solid var(--line); background: rgba(0, 229, 255, .04); color: var(--text); text-align: left; font-family: var(--body); }
.chip:hover { border-color: var(--line-strong); background: rgba(0, 229, 255, .09); }
.chip.on { border-color: var(--cyan); box-shadow: var(--glow-cyan); background: rgba(0, 229, 255, .14); }
.chip .d { font: 700 14px/1 var(--mono); color: #fff; }
.chip .w { font: 600 11px/1.6 var(--mono); color: var(--dim); letter-spacing: .15em; text-transform: uppercase; }
.chip .n { font: 600 12px/1 var(--mono); color: var(--cyan); }
.chip .t { color: var(--red); margin-left: 6px; }
.pick { flex: none; display: flex; align-items: center; }
.pick input { background: rgba(0,0,0,.35); border: 1px solid var(--line); color: var(--text); font: 600 14px var(--mono); padding: 10px; color-scheme: dark; }

/* ---------- stats ---------- */
.stats { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; margin-bottom: 10px; }
.stat { padding: 7px 12px; }
.stat .k { font: 600 10px/1 var(--mono); letter-spacing: .18em; color: var(--dim); text-transform: uppercase; }
.stat .v { font: 900 20px/1.15 var(--head); color: #fff; margin-top: 4px; }
.stat .v.c { color: var(--cyan); text-shadow: var(--glow-cyan); }
.stat .v.r { color: var(--red); text-shadow: var(--glow-red); }
.stat .v.g { color: var(--green); }
.stat .v.s { font-size: 13px; line-height: 1.75; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.stat .bar { height: 2px; margin-top: 5px; background: rgba(255,255,255,.06); overflow: hidden; }
.stat .bar i { display: block; height: 100%; background: linear-gradient(90deg, var(--cyan), var(--magenta)); }

/* ---------- toolbar ---------- */
.toolbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; padding: 10px 12px; margin-bottom: 16px; }
.toolbar label { font: 600 11px var(--mono); letter-spacing: .18em; color: var(--dim); text-transform: uppercase; }
.toolbar select, .toolbar input[type=search] { background: rgba(0,0,0,.35); border: 1px solid var(--line); color: var(--text); font: 600 14px var(--body); padding: 8px 10px; }
.toolbar input[type=search] { min-width: 240px; flex: 1; }
.toggle { cursor: pointer; user-select: none; border: 1px solid var(--line); padding: 8px 12px; font: 700 12px var(--head); letter-spacing: .15em; color: var(--dim); background: transparent; }
.toggle.on { color: #fff; border-color: var(--cyan); background: rgba(0,229,255,.12); box-shadow: var(--glow-cyan); }
.toggle.red.on { border-color: var(--red); background: rgba(255,59,92,.15); box-shadow: var(--glow-red); }
.daytitle { margin-left: auto; font: 700 14px var(--head); letter-spacing: .2em; color: var(--cyan); }

/* ---------- live monitor ---------- */
.toolbar .monctl { display: none; }
body.monitoring .toolbar .feedctl { display: none; }
body.monitoring .toolbar .monctl { display: flex; }
body.monitoring .feed, body.monitoring .jump { display: none !important; }
body.monitoring .wrap { padding-bottom: 14px; }
.camchips { flex-wrap: wrap; gap: 4px; align-items: center; flex: 1; min-width: 0; }
.camchip { cursor: pointer; border: 1px solid var(--line); background: transparent; color: var(--faint); font: 600 9px/1.2 var(--head); letter-spacing: .06em;
  padding: 4px 6px; text-transform: uppercase; }
.monview { flex: none; gap: 8px; align-items: center; padding-left: 12px; border-left: 1px solid var(--line); }
#monitor:fullscreen { background: var(--bg); padding: 10px; align-content: center; overflow: auto; }
.camchip.on { color: #fff; border-color: var(--cyan); background: rgba(0,229,255,.12); }
.camchip.all { border-style: dashed; color: var(--cyan); }
.monitor { display: none; }
body.monitoring .monitor { display: grid; gap: 10px; justify-content: center; align-content: start; }
.monitor .empty, .monitor .loading { grid-column: 1 / -1; }
.tile { position: relative; background: #000; border: 1px solid var(--line-strong); overflow: hidden; aspect-ratio: 16 / 9; }
.tile.solo-hidden { display: none; }
.tile img.snap { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; display: block; cursor: zoom-in; }
.tile .corner { position: absolute; width: 16px; height: 16px; border-color: var(--cyan); border-style: solid; opacity: .85; z-index: 2; pointer-events: none; }
.tile .tl { top: 6px; left: 6px; border-width: 2px 0 0 2px; } .tile .tr { top: 6px; right: 6px; border-width: 2px 2px 0 0; }
.tile .bl { bottom: 6px; left: 6px; border-width: 0 0 2px 2px; } .tile .br { bottom: 6px; right: 6px; border-width: 0 2px 2px 0; }
.tile .tbar { position: absolute; left: 0; right: 0; top: 0; z-index: 3; display: flex; align-items: center; gap: 8px; padding: 8px 12px 18px;
  background: linear-gradient(180deg, rgba(0,0,0,.75), transparent); }
.tile .tname { font: 700 12px var(--head); letter-spacing: .16em; color: #fff; text-transform: uppercase; text-shadow: 0 0 6px #000;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tile .tmode { font: 700 10px var(--head); letter-spacing: .14em; padding: 4px 6px; border: 1px solid var(--line-strong); color: var(--cyan); flex: none; }
.tile.live .tmode { color: var(--red); border-color: var(--red); box-shadow: var(--glow-red); }
.tile.live .tmode::before { content: "\25CF  "; animation: blink 1.2s infinite; }
.tile .tage { margin-left: auto; font: 600 11px var(--mono); color: var(--dim); flex: none; text-shadow: 0 0 6px #000; }
.tile .tage.stale { color: var(--amber); }
.tile .tbtn { flex: none; cursor: pointer; border: 1px solid var(--line-strong); background: rgba(0,10,20,.7); color: #fff; font: 700 10.5px var(--head);
  letter-spacing: .12em; padding: 5px 8px; }
.tile .tbtn:hover { border-color: var(--cyan); box-shadow: var(--glow-cyan); }
.tile .tbtn.golive { border-color: rgba(255,59,92,.6); }
.tile .tbtn.golive:hover { box-shadow: var(--glow-red); }
.tile .tmsg { position: absolute; inset: 0; display: grid; place-items: center; z-index: 1; color: var(--faint); font: 600 12px var(--mono);
  letter-spacing: .2em; text-align: center; padding: 20px; pointer-events: none; }
.tile .terr { position: absolute; left: 10px; right: 10px; bottom: 10px; z-index: 3; font: 500 11.5px var(--mono); color: #ffd3db;
  background: rgba(40,0,10,.75); border-left: 3px solid var(--red); padding: 6px 8px; display: none; }
.tile .terr.show { display: block; }
.focus.livefocus { border-color: var(--red); background: rgba(255,59,92,.14); box-shadow: var(--glow-red); }

/* ---------- feed ---------- */
.feed { display: flex; flex-direction: column; gap: 12px; }
.empty { padding: 60px; text-align: center; color: var(--dim); font: 600 14px var(--mono); letter-spacing: .2em; }
.event { display: grid; grid-template-columns: 112px 232px 1fr 150px; gap: 18px; padding: 14px 16px 14px 20px; transition: border-color .2s, box-shadow .2s, transform .2s; }
.event::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: var(--faint); }
.event.sent::before { background: var(--cyan); box-shadow: var(--glow-cyan); }
.event.skip { opacity: .86; }
.event:hover { border-color: var(--line-strong); transform: translateX(2px); }
.event.suspicious { border-color: rgba(255, 176, 32, .55); }
.event.suspicious::before { background: var(--amber); box-shadow: 0 0 12px var(--amber); }
.event.threat { border-color: rgba(255, 59, 92, .7); animation: alarm 1.6s ease-in-out infinite; }
.event.threat::before { background: var(--red); box-shadow: var(--glow-red); }
@keyframes alarm { 50% { box-shadow: var(--glow-red); } }
.event.fresh { animation: arrive 1.8s ease-out; }
@keyframes arrive { 0% { opacity: 0; transform: translateY(18px); box-shadow: 0 0 40px rgba(0,229,255,.8); } 40% { opacity: 1; transform: none; } }
.event.flash { animation: flash 1.4s ease-out; }
@keyframes flash { 0% { box-shadow: 0 0 30px rgba(255,43,214,.8); } }
.event.target { border-color: var(--magenta); box-shadow: 0 0 22px rgba(255,43,214,.55); }

.when .time { font: 700 22px/1 var(--mono); color: #fff; }
.when .sec { color: var(--dim); font-size: 15px; }
.when .cam { display: inline-block; margin-top: 10px; padding: 4px 8px; font: 700 10.5px/1.2 var(--head); letter-spacing: .12em; color: var(--cyan);
  border: 1px solid var(--line-strong); background: rgba(0,229,255,.07); text-transform: uppercase; max-width: 112px; }
.when .ago { margin-top: 8px; font: 500 11px var(--mono); color: var(--faint); }

.thumb { position: relative; width: 232px; height: 130px; background: #000; border: 1px solid var(--line); overflow: hidden; cursor: pointer; }
.thumb img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform .4s, filter .4s; filter: saturate(.9) contrast(1.05); }
.thumb:hover img { transform: scale(1.06); filter: saturate(1.2); }
.thumb::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, transparent 55%, rgba(0,0,0,.65)); pointer-events: none; }
.thumb .corner { position: absolute; width: 14px; height: 14px; border-color: var(--cyan); border-style: solid; opacity: .9; z-index: 2; }
.thumb .tl { top: 6px; left: 6px; border-width: 2px 0 0 2px; } .thumb .tr { top: 6px; right: 6px; border-width: 2px 2px 0 0; }
.thumb .bl { bottom: 6px; left: 6px; border-width: 0 0 2px 2px; } .thumb .br { bottom: 6px; right: 6px; border-width: 0 2px 2px 0; }
.thumb .play { position: absolute; left: 50%; top: 50%; width: 46px; height: 46px; margin: -23px 0 0 -23px; border-radius: 50%; z-index: 2;
  border: 2px solid var(--cyan); background: rgba(0, 20, 30, .55); box-shadow: var(--glow-cyan); display: grid; place-items: center; transition: transform .2s; }
.thumb:hover .play { transform: scale(1.12); }
.thumb .play::after { content: ""; border-left: 14px solid #fff; border-top: 9px solid transparent; border-bottom: 9px solid transparent; margin-left: 4px; }
.thumb .noimg { position: absolute; inset: 0; display: grid; place-items: center; color: var(--faint); font: 600 11px var(--mono); letter-spacing: .2em; }
.thumb .rec { position: absolute; left: 10px; bottom: 8px; z-index: 2; font: 600 10px var(--mono); color: #fff; letter-spacing: .12em; }

.body { min-width: 0; }
.desc { font-size: 17px; line-height: 1.38; color: #eef5ff; font-weight: 500; }
.tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 9px; }
.tag { font: 600 11px/1 var(--mono); padding: 5px 8px; border: 1px solid var(--line); color: var(--dim); background: rgba(255,255,255,.02); text-transform: lowercase; }
.tag.person { color: var(--green); border-color: rgba(38,255,160,.35); }
.tag.action { color: var(--violet); border-color: rgba(139,92,255,.4); }
.tag.label { color: var(--magenta); border-color: rgba(255,43,214,.4); }
.tag.threat { color: #fff; border-color: var(--red); background: rgba(255,59,92,.25); box-shadow: var(--glow-red); font-weight: 700; text-transform: uppercase; }
.tag.suspicious { color: #111; border-color: var(--amber); background: var(--amber); font-weight: 700; text-transform: uppercase; }
.people { margin-top: 8px; font: 500 13px/1.45 var(--mono); color: var(--dim); }
.people b { color: var(--text); font-weight: 600; }
.threatline { margin-top: 8px; padding: 8px 10px; border-left: 3px solid var(--red); background: rgba(255,59,92,.1); color: #ffd3db; font-size: 15px; }
.threatline.suspicious { border-color: var(--amber); background: rgba(255,176,32,.08); color: #ffe6b5; }
.notif { margin-top: 10px; display: flex; gap: 10px; align-items: flex-start; font-size: 15px; }
.notif .badge { flex: none; font: 700 10.5px/1 var(--head); letter-spacing: .15em; padding: 6px 8px; border: 1px solid; }
.notif .badge.sent { color: var(--cyan); border-color: var(--cyan); box-shadow: var(--glow-cyan); }
.notif .badge.pending { color: var(--amber); border-color: var(--amber); }
.notif .badge.skip { color: var(--faint); border-color: var(--faint); }
.notif .badge.wait { color: var(--violet); border-color: var(--violet); animation: blink 1.4s infinite; }
.notif .msg { color: #cfe9ff; }
.notif .msg.skip { color: var(--dim); font-style: italic; }
.track { margin-top: 8px; font: 500 12.5px var(--mono); color: var(--dim); }
.track a { color: var(--magenta); text-decoration: none; border-bottom: 1px dashed rgba(255,43,214,.5); cursor: pointer; margin-right: 8px; }
.track a:hover { color: #fff; }

.actions { display: flex; flex-direction: column; gap: 8px; justify-content: center; }
.btn { cursor: pointer; display: flex; align-items: center; gap: 8px; justify-content: flex-start; padding: 9px 12px; border: 1px solid var(--line-strong);
  background: rgba(0,229,255,.06); color: var(--text); font: 700 11px/1 var(--head); letter-spacing: .14em; text-transform: uppercase; transition: all .15s; }
.btn:hover { background: rgba(0,229,255,.18); color: #fff; box-shadow: var(--glow-cyan); }
.btn.alt { border-color: rgba(255,43,214,.5); background: rgba(255,43,214,.06); }
.btn.alt:hover { background: rgba(255,43,214,.2); box-shadow: 0 0 14px rgba(255,43,214,.5); }
.btn.ghost { border-color: rgba(139,92,255,.5); background: rgba(139,92,255,.07); }
.btn.ghost:hover { background: rgba(139,92,255,.22); box-shadow: 0 0 14px rgba(139,92,255,.5); }
.btn svg { width: 14px; height: 14px; flex: none; }
.btn:disabled { opacity: .35; cursor: not-allowed; box-shadow: none; }

.player { position: fixed; inset: 0; z-index: 85; display: none; place-items: center; padding: 24px 16px;
  background: rgba(0, 3, 8, .82); backdrop-filter: blur(4px); }
.player.open { display: grid; animation: arrive .3s ease-out; }
.player .frame { width: min(1280px, 100%); max-height: 100%; display: flex; flex-direction: column; background: rgba(5, 10, 20, .96);
  border: 1px solid var(--line-strong); box-shadow: var(--glow-cyan); }
.player .screen { position: relative; background: #000; min-height: 0; }
.player video { display: block; width: 100%; max-height: calc(100vh - 140px); background: #000; }
.player .ptitle { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; padding: 10px 12px; font: 700 11px var(--head); letter-spacing: .18em; color: var(--cyan); }
.player .ptitle .ev { font: 600 12px var(--mono); color: #fff; letter-spacing: .06em; }
.player .pdesc { padding: 8px 12px 12px; color: var(--dim); font-size: 14px; line-height: 1.4; }
.player .ptitle .src { padding: 4px 8px; border: 1px solid currentColor; }
.player .ptitle .src.orig { color: var(--magenta); }
.player .ptitle .path { font: 500 11px var(--mono); color: var(--faint); letter-spacing: 0; text-transform: none; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.player .ptitle .x { margin-left: auto; }

.cfglink { color: var(--dim); text-decoration: none; font: 700 11px var(--head); letter-spacing: .16em; padding: 7px 10px; border: 1px solid var(--line); }
.cfglink:hover { color: #fff; border-color: var(--cyan); box-shadow: var(--glow-cyan); }

/* ---------- security mode (header): normal / home / away / vacation ---------- */
.secmode { --hc: var(--cyan); display: flex; align-items: center; gap: 8px; padding: 4px 4px 4px 10px; border: 1px solid var(--hc); color: var(--hc); }
.secmode b { font: 700 10.5px var(--head); letter-spacing: .2em; }
.secmode select { background: rgba(0,0,0,.5); color: #fff; border: 1px solid var(--line); font: 700 11px var(--head); letter-spacing: .14em; padding: 5px 6px; cursor: pointer; }
.secmode select:focus { outline: none; border-color: var(--hc); }
.secmode small { font: 600 10.5px var(--mono); color: var(--dim); white-space: nowrap; }
.secmode.home { --hc: var(--green); box-shadow: 0 0 14px rgba(38,255,160,.25); }
.secmode.away { --hc: var(--amber); box-shadow: 0 0 14px rgba(255,176,32,.25); }
.secmode.vacation { --hc: var(--magenta); box-shadow: 0 0 14px rgba(255,43,214,.25); }
.tag.secmode { color: var(--amber); border-color: rgba(255,176,32,.45); }
.tag.secmode.home { color: var(--green); border-color: rgba(38,255,160,.45); }
.notif .badge.home { color: var(--green); border-color: rgba(38,255,160,.6); }

/* ---------- incoming (clips still in the pipeline, live view) ---------- */
.incoming { display: none; flex-direction: column; gap: 10px; margin-bottom: 12px; }
.incoming.show { display: flex; }
.inc-h { display: flex; align-items: center; gap: 10px; font: 700 12px var(--head); letter-spacing: .25em; color: var(--amber); }
.inc-h .radar { width: 12px; height: 12px; border-radius: 50%; border: 2px solid var(--amber); position: relative; }
.inc-h .radar::after { content: ""; position: absolute; inset: -6px; border-radius: 50%; border: 1px solid var(--amber); animation: ping 1.6s ease-out infinite; }
@keyframes ping { from { transform: scale(.4); opacity: 1; } to { transform: scale(1.6); opacity: 0; } }
.inc-h .n { color: var(--dim); letter-spacing: .15em; }
.inc { display: grid; grid-template-columns: 112px 232px 1fr 150px; gap: 18px; padding: 12px 16px 12px 20px; overflow: hidden;
  border-color: rgba(255,176,32,.35); transition: border-color .4s, box-shadow .4s; }
.inc::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: var(--amber); box-shadow: 0 0 12px var(--amber); animation: blink 1.4s infinite; }
.inc.fresh { animation: arrive 1.2s ease-out; }
.inc.done { border-color: rgba(0,229,255,.55); }
.inc.done::before { background: var(--cyan); box-shadow: var(--glow-cyan); animation: none; }
.inc.stalled::before { background: var(--red); animation: none; }
.inc .thumb video, .inc .thumb img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; transition: opacity .6s; }
.inc .thumb .raw { filter: grayscale(.55) contrast(1.1) brightness(.85); }
.inc .thumb .src { position: absolute; z-index: 2; right: 8px; top: 7px; font: 700 9.5px var(--head); letter-spacing: .14em; padding: 3px 6px; background: rgba(0,0,0,.7); }
.inc .thumb .src.rawl { color: var(--amber); border: 1px solid rgba(255,176,32,.6); }
.inc .thumb .src.prol { color: var(--cyan); border: 1px solid var(--line-strong); }
.inc .thumb .scanbar { position: absolute; z-index: 2; left: 0; right: 0; height: 2px; background: var(--amber); box-shadow: 0 0 12px var(--amber); animation: scanv 2.4s linear infinite; }
.inc.done .thumb .scanbar { display: none; }
@keyframes scanv { from { top: 0; } to { top: 100%; } }
.inc .stage-t { display: flex; align-items: baseline; gap: 12px; font: 900 15px var(--head); letter-spacing: .2em; color: var(--amber); }
.inc.done .stage-t { color: var(--cyan); }
.inc .stage-t .tm { font: 600 12px var(--mono); letter-spacing: .05em; color: var(--dim); }
.inc .stage-d { margin-top: 4px; font: 500 13px var(--mono); color: var(--dim); }
.inc .desc { margin-top: 8px; font-size: 16px; }
.inc .tags:empty { display: none; }
.inc .tag.person { font-weight: 700; text-transform: uppercase; letter-spacing: .12em; background: rgba(38,255,160,.1); box-shadow: 0 0 10px rgba(38,255,160,.25); }
.inc .tag.person i { display: inline-block; width: 7px; height: 7px; margin-right: 6px; border-radius: 50%; background: var(--green); box-shadow: 0 0 8px var(--green); animation: blink 1.4s infinite; }
.inc .tag .by { margin-left: 6px; font-weight: 500; letter-spacing: .04em; text-transform: lowercase; opacity: .7; }
.inc .tag.trigger { border-style: dashed; }
.pipe { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; margin-top: 10px; }
.pipe span { position: relative; height: 22px; display: grid; place-items: center; font: 700 9px var(--head); letter-spacing: .12em; color: var(--faint);
  border: 1px solid var(--line); background: rgba(0,0,0,.3); overflow: hidden; transition: color .4s, border-color .4s, background .4s; }
.pipe span.ok { color: var(--cyan); border-color: rgba(0,229,255,.45); background: rgba(0,229,255,.1); }
.pipe span.cur { color: #fff; border-color: var(--amber); background: rgba(255,176,32,.14); box-shadow: 0 0 10px rgba(255,176,32,.45); }
.pipe span.cur::after { content: ""; position: absolute; top: 0; bottom: 0; width: 40%; background: linear-gradient(90deg, transparent, rgba(255,176,32,.5), transparent); animation: pipesweep 1.3s linear infinite; }
.inc.done .pipe span.cur { border-color: var(--cyan); background: rgba(0,229,255,.16); box-shadow: var(--glow-cyan); }
.inc.done .pipe span.cur::after { background: linear-gradient(90deg, transparent, rgba(0,229,255,.5), transparent); }
@keyframes pipesweep { from { left: -40%; } to { left: 100%; } }
.inc .stampx { position: absolute; z-index: 5; inset: 0; display: none; place-items: center; pointer-events: none; }
.inc .stampx b { padding: 10px 22px; font: 900 26px var(--head); letter-spacing: .35em; color: var(--red); border: 3px solid var(--red); transform: rotate(-6deg);
  background: rgba(20,0,6,.75); box-shadow: var(--glow-red); text-shadow: var(--glow-red); }
.inc .stampx small { display: block; margin-top: 6px; font: 600 11px var(--mono); letter-spacing: .05em; color: #ffd3db; text-align: center; }
.inc.discard { border-color: var(--red); box-shadow: var(--glow-red); }
.inc.discard::before { background: var(--red); box-shadow: var(--glow-red); animation: none; }
.inc.discard .stampx { display: grid; animation: slam .35s cubic-bezier(.2,1.6,.4,1); }
.inc.discard > :not(.stampx) { filter: grayscale(1) brightness(.6); transition: filter .5s; }
@keyframes slam { from { transform: scale(2.2); opacity: 0; } to { transform: none; opacity: 1; } }
/* ignored: glitch, then collapse to a line and switch off like an old CRT */
.inc.vanish { animation: vanish 1.1s cubic-bezier(.6,0,.4,1) forwards; }
@keyframes vanish {
  0% { clip-path: inset(0 0 0 0); transform: none; filter: none; }
  12% { transform: translateX(-8px) skewX(10deg); filter: hue-rotate(90deg) saturate(3); }
  24% { transform: translateX(10px) skewX(-8deg); clip-path: inset(12% 0 30% 0); }
  36% { transform: translateX(-4px); clip-path: inset(38% 0 18% 0); filter: blur(1px) brightness(2); }
  55% { clip-path: inset(47% 0 47% 0); transform: scaleX(1.05); filter: brightness(3); opacity: 1; }
  75% { clip-path: inset(49.6% 0 49.6% 0); transform: scaleX(.25); filter: brightness(4); }
  100% { clip-path: inset(50% 50% 50% 50%); transform: scaleX(0); opacity: 0; }
}
.inc.landed { animation: landed .7s ease-in forwards; }
@keyframes landed { 0% { box-shadow: 0 0 40px rgba(0,229,255,.9); } 100% { opacity: 0; transform: translateY(14px) scale(.98); } }
/* processed: the pipeline card glides into its place in the feed and becomes the event row / joins its activity */
.inc.flying { position: fixed; z-index: 45; margin: 0; pointer-events: none; box-shadow: 0 0 34px rgba(0,229,255,.55); transition: opacity .3s; }
.inc-ph { flex: none; transition: height .9s cubic-bezier(.65,0,.35,1), margin .9s cubic-bezier(.65,0,.35,1); }
.landing { visibility: hidden; }
.event.arrived, .activity.arrived { animation: arrived 1.2s ease-out; }
@keyframes arrived { 0% { box-shadow: 0 0 34px rgba(0,229,255,.75); border-color: var(--cyan); } }
.inc.gone { height: 0 !important; padding-top: 0; padding-bottom: 0; margin-top: -10px; border-width: 0; transition: height .35s ease, padding .35s, margin .35s; }
@media (max-width: 1100px) { .inc { grid-template-columns: 1fr; } .inc .thumb { width: 100%; } }

/* ---------- activities (stitched clips) ---------- */
.activity { display: flex; flex-direction: column; gap: 12px; padding: 14px 16px 14px 20px; transition: border-color .2s, box-shadow .2s; }
.activity::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: linear-gradient(180deg, var(--violet), var(--cyan)); }
.activity.sent::before { background: var(--cyan); box-shadow: var(--glow-cyan); }
.activity.suspicious { border-color: rgba(255, 176, 32, .55); }
.activity.suspicious::before { background: var(--amber); box-shadow: 0 0 12px var(--amber); }
.activity.threat { border-color: rgba(255, 59, 92, .7); animation: alarm 1.6s ease-in-out infinite; }
.activity.threat::before { background: var(--red); box-shadow: var(--glow-red); }
.activity.fresh { animation: arrive 1.8s ease-out; }
.activity.flash { animation: flash 1.4s ease-out; }
.activity:hover { border-color: var(--line-strong); }
.ihead { display: grid; grid-template-columns: 112px 1fr 170px; gap: 18px; }
.ihead .to { margin-top: 6px; font: 600 13px var(--mono); color: var(--dim); }
.ibody { min-width: 0; }
.kicker { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; font: 700 11px var(--head); letter-spacing: .2em; color: var(--violet); }
.kicker .badge { font: 700 10px/1 var(--head); letter-spacing: .15em; padding: 5px 7px; border: 1px solid; }
.kicker .trk { color: var(--green); border-color: var(--green); animation: blink 1.4s infinite; }
.kicker .cont { color: var(--magenta); border-color: rgba(255,43,214,.5); cursor: pointer; text-decoration: none; }
.ipath { margin-top: 6px; font: 700 15px var(--head); letter-spacing: .1em; color: #fff; text-transform: uppercase; }
.ipath i { font-style: normal; color: var(--magenta); margin: 0 9px; text-shadow: 0 0 10px rgba(255,43,214,.7); }
.lanes { margin-top: 10px; display: flex; flex-direction: column; gap: 5px; }
.lane { display: grid; grid-template-columns: 130px 1fr; gap: 10px; align-items: center; }
.lane .ln { font: 600 10.5px var(--mono); letter-spacing: .08em; color: var(--dim); text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.lane .bar { position: relative; height: 12px; border: 1px solid var(--line); background: repeating-linear-gradient(90deg, rgba(0,229,255,.05) 0 1px, transparent 1px 10%), rgba(0,0,0,.35); }
.lane .clip { position: absolute; top: 1px; bottom: 1px; min-width: 4px; cursor: pointer; transition: filter .15s; }
.lane .clip:hover { filter: brightness(1.6); }
.lane .clip.c0 { background: var(--cyan); box-shadow: var(--glow-cyan); } .lane .clip.c1 { background: var(--magenta); box-shadow: 0 0 10px rgba(255,43,214,.6); }
.lane .clip.c2 { background: var(--green); box-shadow: 0 0 10px rgba(38,255,160,.5); } .lane .clip.c3 { background: var(--amber); box-shadow: 0 0 10px rgba(255,176,32,.5); }
.axis { display: flex; justify-content: space-between; margin-left: 140px; font: 500 10px var(--mono); color: var(--faint); }
.strip { display: flex; align-items: center; gap: 6px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: thin; scrollbar-color: var(--line-strong) transparent; }
.fr { position: relative; flex: none; width: 150px; height: 84px; padding: 0; border: 1px solid var(--line); background: #000; cursor: pointer; overflow: hidden; }
.fr img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform .3s; }
.fr:hover { border-color: var(--cyan); box-shadow: var(--glow-cyan); } .fr:hover img { transform: scale(1.06); }
.fr .cap { position: absolute; left: 0; right: 0; bottom: 0; padding: 3px 6px; font: 600 10px var(--mono); color: #fff; text-align: left;
  background: linear-gradient(180deg, transparent, rgba(0,0,0,.85)); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.fr .noimg { position: absolute; inset: 0; display: grid; place-items: center; color: var(--faint); font: 600 10px var(--mono); }
.fsep { flex: none; font: 700 12px var(--mono); color: var(--magenta); text-align: center; min-width: 26px; }
.fsep small { display: block; font-size: 9.5px; color: var(--faint); }
.isum .iline { font-size: 15px; line-height: 1.4; color: #eef5ff; margin-top: 3px; }
.isum .iline b { font: 600 12px var(--mono); color: var(--cyan); margin-right: 6px; }
.isum .iline em { font: 700 10.5px var(--head); letter-spacing: .1em; color: var(--dim); font-style: normal; margin-right: 6px; text-transform: uppercase; }
.isum .more { margin-top: 4px; font: 500 12px var(--mono); color: var(--faint); }
.members { display: none; flex-direction: column; gap: 10px; padding-left: 14px; border-left: 1px dashed var(--line-strong); }
.activity.expanded .members { display: flex; }
.event.dim { opacity: .35; }

/* ---------- sequence player ---------- */
.player .seq { width: min(1400px, 100%); }
.seqscreen { position: relative; width: 100%; aspect-ratio: 16 / 9; max-height: calc(100vh - 230px); background: #000; overflow: hidden; }
.player .seqscreen video { position: absolute; inset: 0; width: 100%; height: 100%; max-height: none; object-fit: contain; background: #000; cursor: pointer; opacity: 0; }
.player .seqscreen video.on { opacity: 1; z-index: 1; }
.seqscreen .sqcam { position: absolute; z-index: 3; left: 12px; top: 10px; padding: 5px 9px; font: 700 12px var(--head); letter-spacing: .16em; color: var(--cyan);
  background: rgba(0,0,0,.65); border: 1px solid var(--line-strong); text-transform: uppercase; pointer-events: none; }
.seqscreen .sqcam.cutin { animation: flash 1.2s ease-out; }
.sqwhen { position: absolute; z-index: 3; right: 12px; bottom: 12px; padding: 6px 10px 5px; pointer-events: none; text-align: right;
  font: 700 22px/1 var(--mono); color: #fff; letter-spacing: .04em; font-variant-numeric: tabular-nums;
  background: rgba(0, 6, 14, .62); border: 1px solid rgba(0,229,255,.45); box-shadow: var(--glow-cyan); text-shadow: 0 0 8px rgba(0,229,255,.9); }
.sqwhen small { display: block; margin-bottom: 3px; font: 600 10px var(--mono); letter-spacing: .2em; color: var(--cyan); text-shadow: none; }
.sqwhen .ms { color: var(--cyan); }
.player .screen .sqwhen { bottom: auto; top: 12px; }
.pipbox { position: absolute; z-index: 4; left: 12px; top: 46px; display: flex; flex-direction: column; gap: 8px; width: 30%; max-width: 380px; }
.pipv { position: relative; opacity: 0; transform: scale(.9) translateX(-12px); pointer-events: none; transition: opacity .5s ease, transform .5s ease; aspect-ratio: 16 / 9; background: #000; border: 1px solid var(--magenta); box-shadow: 0 0 16px rgba(255,43,214,.55); cursor: pointer; }
.pipv.show { opacity: 1; transform: none; pointer-events: auto; }
.pipv.off { display: none; }
.pipv:hover { border-color: #fff; }
.player .pipv video { position: absolute; inset: 0; width: 100%; height: 100%; max-height: none; object-fit: contain; opacity: 1; }
.pipv .pl { position: absolute; z-index: 1; left: 6px; top: 5px; padding: 2px 6px; font: 700 10px var(--head); letter-spacing: .14em; color: var(--magenta);
  background: rgba(0,0,0,.7); text-transform: uppercase; pointer-events: none; }
.pipchk { display: flex; align-items: center; gap: 6px; cursor: pointer; user-select: none; font: 700 11px var(--head); letter-spacing: .15em; color: var(--dim);
  padding: 7px 9px; border: 1px solid var(--line); }
.pipchk:has(input:checked) { color: #fff; border-color: var(--magenta); box-shadow: 0 0 10px rgba(255,43,214,.45); }
.pipchk input { accent-color: var(--magenta); margin: 0; }
.seqscreen .sqbuf { position: absolute; z-index: 2; inset: 0; display: none; place-items: center; font: 600 12px var(--mono); letter-spacing: .3em; color: var(--dim); pointer-events: none; }
.seqscreen.buffering .sqbuf { display: grid; }
.seq .count { font: 700 11px var(--head); letter-spacing: .15em; color: var(--dim); }
.seq .ctrl { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; padding: 10px 12px; }
.seq .ctrl input[type=range] { flex: 1; min-width: 200px; accent-color: var(--cyan); }
.seq .clock2 { font: 700 15px var(--mono); color: #fff; min-width: 76px; }
.seq .gapnote { font: 600 11px var(--mono); color: var(--amber); letter-spacing: .1em; min-width: 90px; }
.seq .spd.on { color: #fff; border-color: var(--cyan); background: rgba(0,229,255,.2); box-shadow: var(--glow-cyan); }
.seq .chips2 { display: flex; flex-wrap: wrap; gap: 6px; padding: 0 12px 8px; }
.chip2 { cursor: pointer; padding: 5px 8px; border: 1px solid var(--line); background: transparent; color: var(--dim); font: 600 11px var(--mono); }
.chip2:hover { color: #fff; border-color: var(--line-strong); }
.chip2.on { color: #fff; border-color: var(--cyan); background: rgba(0,229,255,.12); }
@media (max-width: 760px) {
  .ihead { grid-template-columns: 1fr; } .lane { grid-template-columns: 90px 1fr; } .axis { margin-left: 100px; }
}

/* ---------- jump button ---------- */
.jump { position: fixed; right: 28px; top: 86px; z-index: 40; display: none; cursor: pointer; border: 1px solid var(--cyan); background: rgba(0, 20, 30, .9);
  color: #fff; font: 700 12px var(--head); letter-spacing: .18em; padding: 12px 16px; box-shadow: var(--glow-cyan); }
.jump.show { display: block; animation: arrive .4s; }
.toast { position: fixed; left: 50%; top: 22px; transform: translateX(-50%); z-index: 60; padding: 14px 20px; border: 1px solid var(--magenta);
  background: rgba(20, 5, 25, .95); color: #fff; font: 700 13px var(--head); letter-spacing: .15em; box-shadow: 0 0 30px rgba(255,43,214,.5); display: none; }
.toast.show { display: block; animation: arrive .5s; }

/* ---------- analysis drawer ---------- */
.shade { position: fixed; inset: 0; z-index: 70; background: rgba(0, 3, 8, .7); backdrop-filter: blur(3px); display: none; }
.shade.open { display: block; }
.drawer { position: fixed; top: 0; right: 0; bottom: 0; z-index: 80; width: min(980px, 100%); transform: translateX(105%); transition: transform .35s cubic-bezier(.2,.8,.2,1);
  background: linear-gradient(180deg, #081122, #050912); border-left: 1px solid var(--line-strong); box-shadow: -20px 0 60px rgba(0,0,0,.6); overflow-y: auto; }
.drawer.open { transform: none; }
.drawer .dh { position: sticky; top: 0; z-index: 2; display: flex; align-items: center; gap: 14px; padding: 18px 22px; background: rgba(5, 10, 20, .95); border-bottom: 1px solid var(--line); }
.drawer .dh h2 { margin: 0; font: 900 16px var(--head); letter-spacing: .25em; color: #fff; text-shadow: var(--glow-cyan); }
.drawer .dh .sub { font: 500 12px var(--mono); color: var(--dim); }
.drawer .dh .x { margin-left: auto; }
.drawer .db { padding: 20px 22px 60px; }
.sect { margin-bottom: 22px; }
.sect h3 { margin: 0 0 10px; font: 700 12px var(--head); letter-spacing: .25em; color: var(--cyan); }
.sect p.explain { margin: 0 0 10px; color: var(--dim); font-size: 14.5px; }
.flow { display: grid; grid-template-columns: repeat(6, 1fr); gap: 10px; }
.stage { position: relative; padding: 12px; border: 1px solid var(--line); background: var(--panel); }
.stage::after { content: "›"; position: absolute; right: -10px; top: 50%; transform: translateY(-50%); color: var(--cyan); font: 900 18px var(--head); }
.stage:last-child::after { display: none; }
.stage .sn { font: 600 10px var(--mono); color: var(--faint); letter-spacing: .2em; }
.stage .st { font: 700 13px var(--head); letter-spacing: .12em; color: #fff; margin: 4px 0 8px; }
.stage .res { font: 700 11px var(--head); letter-spacing: .15em; }
.stage .res.pass { color: var(--green); } .stage .res.fail { color: var(--red); } .stage .res.info { color: var(--violet); }
.stage .res.skipped { color: var(--faint); } .stage.skipped .st { color: var(--dim); }
.stage .kv { margin-top: 8px; font: 500 11.5px/1.5 var(--mono); color: var(--dim); }
.stage .kv b { color: var(--text); font-weight: 600; }
.stage.pass { border-color: rgba(38,255,160,.35); } .stage.fail { border-color: rgba(255,59,92,.55); }
.timeline { position: relative; height: 54px; border: 1px solid var(--line); background: repeating-linear-gradient(90deg, rgba(0,229,255,.06) 0 1px, transparent 1px 10%), rgba(0,0,0,.35); margin: 8px 0 4px; }
.timeline .seg { position: absolute; top: 10px; bottom: 10px; background: linear-gradient(180deg, rgba(0,229,255,.55), rgba(0,229,255,.2)); border: 1px solid var(--cyan); box-shadow: var(--glow-cyan); }
.timeline .keep { position: absolute; top: 3px; bottom: 3px; border: 2px solid var(--magenta); box-shadow: 0 0 14px rgba(255,43,214,.5); background: rgba(255,43,214,.08); }
.timeline .tick { position: absolute; top: 0; bottom: 0; width: 2px; background: var(--amber); box-shadow: 0 0 8px var(--amber); }
.timeline .thumbmark { position: absolute; top: -6px; bottom: -6px; width: 2px; background: #fff; box-shadow: 0 0 10px #fff; }
.scale { display: flex; justify-content: space-between; font: 500 10.5px var(--mono); color: var(--faint); }
.legend { display: flex; flex-wrap: wrap; gap: 14px; margin-top: 8px; font: 500 12px var(--mono); color: var(--dim); }
.legend i { display: inline-block; width: 14px; height: 8px; margin-right: 6px; vertical-align: 0; }
table.grid { width: 100%; border-collapse: collapse; font: 500 12.5px var(--mono); }
table.grid th { text-align: left; font: 600 10.5px var(--mono); letter-spacing: .18em; color: var(--faint); text-transform: uppercase; padding: 6px 8px; border-bottom: 1px solid var(--line); }
table.grid td { padding: 7px 8px; border-bottom: 1px solid rgba(0,229,255,.07); color: var(--text); vertical-align: top; }
.conf { display: inline-block; height: 6px; background: var(--green); box-shadow: 0 0 6px var(--green); vertical-align: middle; margin-right: 6px; }
pre.raw { max-height: 420px; overflow: auto; padding: 14px; font: 12px/1.5 var(--mono); color: #9fd8ff; background: rgba(0,0,0,.5); border: 1px solid var(--line); }
details summary { cursor: pointer; font: 700 12px var(--head); letter-spacing: .2em; color: var(--violet); }
.loading { padding: 40px; text-align: center; font: 600 13px var(--mono); color: var(--cyan); letter-spacing: .3em; animation: blink 1.2s infinite; }

/* ---------- layout with the analyst chat on the right ---------- */
.shell { display: grid; grid-template-columns: minmax(0, 1fr) var(--chat-w, 430px); min-height: 100vh; }
.shell.nochat { grid-template-columns: minmax(0, 1fr) 0; }
.shell .wrap { max-width: none; width: 100%; }
.shell:not(.nochat) .jump { right: calc(var(--chat-w, 430px) + 28px); }
.chat { position: sticky; top: 0; height: 100vh; display: flex; flex-direction: column; border-left: 1px solid var(--line-strong);
  background: linear-gradient(180deg, rgba(8, 16, 32, .92), rgba(4, 8, 16, .96)); backdrop-filter: blur(12px); z-index: 30; min-width: 0; }
.chat::before { content: ""; position: absolute; left: -1px; top: 0; bottom: 0; width: 2px; background: linear-gradient(180deg, transparent, var(--magenta), var(--cyan), transparent); opacity: .6; }
.shell.nochat .chat { display: none; }

  border: 1px solid var(--magenta); background: rgba(20, 5, 25, .9); color: #fff; font: 700 11px var(--head); letter-spacing: .3em; box-shadow: 0 0 18px rgba(255,43,214,.45); display: none; }

<div class="shell" id="shell">
<div class="wrap">

  <div class="db" id="dBody"></div>

<script>
"use strict";
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c]));
const media = rel => "/media/" + String(rel).split("/").map(encodeURIComponent).join("/");
const ICON = {
  play: '<svg viewBox="0 0 16 16" fill="currentColor"><path d="M4 2.5v11l9-5.5z"/></svg>',
  orig: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="1.5" y="3.5" width="13" height="9"/><path d="M6.5 6v4l3.5-2z" fill="currentColor"/></svg>',
  scan: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M1.5 5V1.5H5M11 1.5h3.5V5M14.5 11v3.5H11M5 14.5H1.5V11M4 8h8"/></svg>',
};

const state = {
  cfg: null, mode: "day", date: null, events: new Map(), order: [],
  filters: { cam: "", q: "", threat: false, sent: false }, auto: true, unseen: 0, pollTimer: null, daysTimer: null,
  // stitching: activities from the server (null = none), the feed's current units, activity cards, event -> activity
  stitch: true, groups: null, list: [], units: new Map(), memberOf: new Map(), seq: null,
  inc: new Map(), incGone: new Set(),   // live view: clips still in the pipeline (by event id), ones already animated out
  landing: new Set(),                   // events whose pipeline card is on its way to them (hidden until it arrives)
};
const RANK = { none: 0, suspicious: 1, threat: 2 };

// ---------- helpers ----------
const sev = e => ((e.summary || {}).threat || {}).level || "none";
const videoPath = (e, which) => {
  const l = e[which];
  if (l && l.folder && l.video_file) return l.folder + "/" + l.video_file;
  return which === "processed" ? e.video : null;
};
function tparts(iso) {
  const m = /T(\d\d):(\d\d):(\d\d)/.exec(iso || "");
  return m ? { hm: `${m[1]}:${m[2]}`, s: m[3] } : { hm: "--:--", s: "--" };
}
function ago(iso) {
  const t = Date.parse(iso); if (isNaN(t)) return "";
  const d = Math.max(0, (Date.now() - t) / 1000);
  if (d < 60) return "just now"; if (d < 3600) return `${Math.floor(d / 60)} min ago`;
  if (d < 86400) return `${Math.floor(d / 3600)} h ${Math.floor(d % 3600 / 60)} min ago`; return "";
}
function fmtDur(sec) {
  sec = Math.max(0, Math.round(sec));
  return sec < 60 ? `${sec}s` : sec < 3600 ? `${Math.floor(sec / 60)}m ${String(sec % 60).padStart(2, "0")}s` : `${Math.floor(sec / 3600)}h ${Math.floor(sec % 3600 / 60)}m`;
}
const weekday = d => new Date(d + "T12:00:00").toLocaleDateString(undefined, { weekday: "short" });
const human = d => new Date(d + "T12:00:00").toLocaleDateString(undefined, { weekday: "long", year: "numeric", month: "long", day: "numeric" });
async function api(path) {
  const r = await fetch(path, { cache: "no-store" });
  if (!r.ok) throw new Error(`${r.status} ${path}`);
  return r.json();
}
function setLink(ok) { $("#link").classList.toggle("down", !ok); $("#link").title = ok ? "Backend online" : "Backend unreachable"; }
function toast(msg, ms = 4500) { const t = $("#toast"); t.textContent = msg; t.classList.add("show"); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove("show"), ms); }

// ---------- clock ----------
function tick() {
  const now = new Date(), tz = state.cfg?.timezone;
  const o = tz ? { timeZone: tz } : {};
  $("#clock").firstChild.nodeValue = now.toLocaleTimeString("en-GB", { ...o, hour12: false });
  $("#clockdate").textContent = (tz ? tz + " · " : "") + now.toLocaleDateString("en-CA", o);
}
setInterval(tick, 1000);

// ---------- routing ----------
function route() {
  const h = location.hash;
  const m = /^#\/day\/(\d{4}-\d{2}-\d{2})$/.exec(h);
  if (m && m[1] !== state.cfg.today) return open("day", m[1]);
  if (h !== "#/live") history.replaceState(null, "", "#/live");
  open("live", state.cfg.today);
}
window.addEventListener("hashchange", route);
function go(date) { location.hash = (!date || date === state.cfg.today) ? "#/live" : `#/day/${date}`; }

async function open(mode, date) {
  stopPoll();
  state.mode = mode; state.date = date; state.events.clear(); state.order = []; state.unseen = 0;
  state.groups = null; state.list = []; state.units.clear(); state.memberOf.clear();
  state.inc.clear(); state.incGone.clear(); state.landing.clear(); document.querySelectorAll(".inc.flying").forEach(n => n.remove()); $("#incList").innerHTML = ""; $("#incoming").classList.remove("show");
  $("#jump").classList.remove("show");
  $("#mode").className = "mode" + (mode === "live" ? " live" : "");
  $("#mode").textContent = mode === "live" ? "LIVE" : "ARCHIVE";
  $("#tAuto").style.display = mode === "live" ? "" : "none";
  $("#dayTitle").textContent = human(date).toUpperCase();
  $("#datePick").value = date;
  markChip();
  applyMonitor();  // the live monitor is part of live mode
  chat.detached = false; syncFocus();  // the analyst follows the selected day until detached (✕)
  $("#feed").innerHTML = '<div class="loading">ACQUIRING EVENT STREAM</div>';
  await loadEvents(true);
  if (mode === "live") startPoll();
}

// ---------- days ----------
async function loadDays() {
  try {
    const d = await api("/api/days"); setLink(true);
    const days = d.days;
    if (!days.some(x => x.date === d.today)) days.unshift({ date: d.today, events: 0, sent: 0, threats: 0 });
    days.reverse();  // oldest left, today right-most
    const chips = $("#chips"), first = !chips.children.length;
    chips.innerHTML = days.map(x => `
      <button class="chip cut" data-date="${x.date}">
        <div class="w">${x.date === d.today ? "TODAY" : weekday(x.date)}</div>
        <div class="d">${x.date.slice(5)}</div>
        <div class="n">${x.events} EVT${x.threats ? `<span class="t">▲${x.threats}</span>` : ""}</div>
      </button>`).join("");
    chips.querySelectorAll(".chip").forEach(c => c.onclick = () => go(c.dataset.date));
    if (first) chips.scrollLeft = chips.scrollWidth;  // start at today
    markChip();
  } catch { setLink(false); }
}
function markChip() { $("#chips").querySelectorAll(".chip").forEach(c => c.classList.toggle("on", c.dataset.date === state.date)); }

// ---------- events ----------
async function loadEvents(first) {
  let data;
  try { data = await api(`/api/events/${state.date}`); setLink(true); }
  catch { setLink(false); if (first) $("#feed").innerHTML = '<div class="empty">BACKEND UNREACHABLE — RETRYING</div>'; return; }
  if (state.mode === "live" && data.today !== state.date) { dayRollover(data.today); return; }
  const feed = $("#feed");
  if (first) feed.innerHTML = "";
  let added = 0;
  for (const e of data.events) {
    const id = e.event_id, json = JSON.stringify(e);
    const known = state.events.get(id);
    if (!known) {
      const el = renderEvent(e), inc = state.inc.get(id);
      if (inc && !inc.leaving && state.mode === "live") { state.landing.add(id); el.classList.add("landing"); }  // its pipeline card moves in
      else if (!first) el.classList.add("fresh");
      state.events.set(id, { e, json, el }); state.order.push(id);
      added++;
    } else if (known.json !== json) {
      const el = renderEvent(e); el.classList.add(state.landing.has(id) ? "landing" : "flash");
      known.el.replaceWith(el); known.e = e; known.json = json; known.el = el;
    }
  }
  state.groups = data.groups || null;
  layout(first);
  renderStats(); fillCameras();
  if (!state.order.length) feed.innerHTML = `<div class="empty">${state.mode === "live" ? "STANDING BY — NO EVENTS YET TODAY" : "NO EVENTS RECORDED ON THIS DAY"}</div>`;
  else feed.querySelector(".empty")?.remove();
  if (state.mode === "live") {
    if (first) requestAnimationFrame(() => scrollTop(false));
    else if (added) onNew(added);
  }
  if (added && !first) loadDays();
  if (state.mode === "live") loadIncoming(first);
}
// The feed is a list of units, newest activity first: an activity card for
// 2+ stitched clips (server-side stitch.Stitcher), else the clip's own row.
function units() {
  const byTime = (a, b) => (b.e.recorded_at || "").localeCompare(a.e.recorded_at || "");
  const singles = ids => ids.map(id => state.events.get(id)).filter(Boolean).sort(byTime).map(x => ({ id: x.e.event_id, events: [x.e.event_id] }));
  if (!state.stitch || !state.groups) return singles(state.order);
  const grouped = new Set(state.groups.flatMap(g => g.events));
  const list = state.groups.map(g => ({ ...g, events: g.events.filter(id => state.events.has(id)) })).filter(g => g.events.length);
  return singles(state.order.filter(id => !grouped.has(id))).concat(list);  // not stitched yet: on top
}
function layout(first) {
  const feed = $("#feed"), list = units(), keep = new Set(), nodes = [];
  state.list = list; state.memberOf = new Map();
  for (const g of list) {
    if (g.events.length < 2) { nodes.push(state.events.get(g.events[0]).el); continue; }
    g.events.forEach(id => state.memberOf.set(id, g.id));
    const sig = JSON.stringify(g) + g.events.map(id => state.events.get(id).json).join("");
    let u = state.units.get(g.id);
    if (!u || u.sig !== sig) {
      const el = renderActivity(g, !!u?.el.classList.contains("expanded"));
      const landing = g.events.filter(id => state.landing.has(id)).length;
      if (landing && !u && landing === g.events.length) el.classList.add("landing");  // all of it still on its way
      else if (landing) { if (u?.el.classList.contains("landing")) el.classList.add("landing"); }  // the moving card brings the change
      else if (u) { if (u.g.events.length !== g.events.length) el.classList.add("flash"); }
      else if (!first) el.classList.add("fresh");
      if (u) u.el.replaceWith(el);
      u = { el, sig, g }; state.units.set(g.id, u);
    }
    keep.add(g.id); nodes.push(u.el);
  }
  for (const [id, u] of state.units) if (!keep.has(id)) { u.el.remove(); state.units.delete(id); }
  nodes.forEach((n, i) => { if (feed.children[i] !== n) feed.insertBefore(n, feed.children[i] || null); });
  while (feed.children.length > nodes.length) feed.lastElementChild.remove();
  applyFilters();
  syncSequence(list);
}

function renderActivity(g, expanded) {
  const xs = g.events.map(id => state.events.get(id)), evs = xs.map(x => x.e);
  const clips = g.events.map(id => ({ id, ...g.clips[id], e: state.events.get(id).e }));
  const lvl = evs.map(sev).reduce((a, b) => (RANK[b] > RANK[a] ? b : a), "none");
  const sent = evs.filter(e => e.notification?.decision === "send");
  const t0 = tparts(g.start), t1 = tparts(g.end);
  const gs = clips[0].start_ms, ge = Math.max(...clips.map(c => c.end_ms)), span = Math.max(1000, ge - gs);
  const cams = [...new Set(clips.map(c => c.camera))];
  const el = document.createElement("article");
  el.className = `activity panel cut ${sent.length ? "sent" : ""} ${lvl !== "none" ? lvl : ""} ${expanded ? "expanded" : ""}`;
  el.id = "in-" + g.id;

  // camera path: "+" when a clip starts while an earlier one still records, "→" when it follows
  let path = "", reach = -Infinity, last = null;
  for (const c of clips) {
    if (c.camera !== last) path += (last === null ? "" : `<i>${c.start_ms < reach ? "+" : "→"}</i>`) + esc(c.camera);
    last = c.camera; reach = Math.max(reach, c.end_ms);
  }
  const lanes = cams.map((cam, k) => `<div class="lane"><span class="ln" title="${esc(cam)}">${esc(cam)}</span><div class="bar">${clips.filter(c => c.camera === cam).map(c => {
      const left = (c.start_ms - gs) / span * 100, width = Math.min(100 - left, Math.max(.8, (c.end_ms - c.start_ms) / span * 100));
      const t = tparts(c.e.recorded_at);
      return `<span class="clip c${k % 4}" data-seq="${esc(c.id)}" style="left:${left}%;width:${width}%"
        title="${esc(`${t.hm}:${t.s} · ${fmtDur((c.end_ms - c.start_ms) / 1000)} · ${(c.e.summary || {}).description || ""}`)}"></span>`;
    }).join("")}</div></div>`).join("");
  let strip = "", stripReach = -Infinity;
  clips.forEach((c, i) => {
    const t = tparts(c.e.recorded_at);
    if (i) strip += c.start_ms < stripReach ? `<span class="fsep" title="same moment">+</span>`
      : `<span class="fsep" title="then">→<small>${fmtDur((c.start_ms - stripReach) / 1000)}</small></span>`;
    stripReach = Math.max(stripReach, c.end_ms);
    strip += `<button class="fr" data-seq="${esc(c.id)}" title="Play the sequence from here">
      ${c.e.thumbnail ? `<img loading="lazy" src="${media(c.e.thumbnail)}" alt="">` : '<div class="noimg">NO SIGNAL</div>'}
      <span class="cap">${t.hm}:${t.s} · ${esc(c.camera)}</span></button>`;
  });
  const uniq = xs => [...new Set(xs)];
  const tags = [
    ...securityTags(evs),
    ...(lvl !== "none" ? [`<span class="tag ${lvl}">${lvl === "threat" ? "▲ THREAT" : "◆ SUSPICIOUS"}</span>`] : []),
    ...uniq(evs.flatMap(e => (e.summary || {}).people_types || [])).map(p => `<span class="tag person">${esc(p.replace(/_/g, " "))}</span>`),
    ...uniq(evs.flatMap(e => (e.summary || {}).actions || [])).map(a => `<span class="tag action">${esc(a.replace(/_/g, " "))}</span>`),
    ...uniq(evs.flatMap(e => (e.summary || {}).labels || [])).map(l => `<span class="tag label">#${esc(l)}</span>`),
  ].join("");
  const LINES = 4;
  const lines = clips.slice(0, LINES).map(c => { const t = tparts(c.e.recorded_at);
    return `<div class="iline"><b>${t.hm}:${t.s}</b><em>${esc(c.camera)}</em>${esc((c.e.summary || {}).description || "(no description)")}</div>`; }).join("")
    + (clips.length > LINES ? `<div class="more">+ ${clips.length - LINES} more clip${clips.length - LINES > 1 ? "s" : ""} — ▾ CLIPS</div>` : "");
  let notif;
  if (sent.length) notif = `<span class="badge ${sent.every(e => e.notification.sent_at) ? "sent" : "pending"}">${sent.length} ALERT${sent.length > 1 ? "S" : ""} SENT</span><span class="msg">${esc(sent[0].notification.message)}</span>`;
  else if (evs.some(e => !e.notification)) notif = `<span class="badge wait">ANALYZING</span><span class="msg skip">awaiting notification decisions…</span>`;
  else notif = `<span class="badge skip">SUPPRESSED</span><span class="msg skip">${esc(evs[evs.length - 1].notification.skip_reason)}</span>`;

  el.innerHTML = `
    <div class="ihead">
      <div class="when">
        <div class="time">${t0.hm}<span class="sec">:${t0.s}</span></div>
        <div class="to">→ ${t1.hm}:${t1.s}</div>
        <div class="ago" data-ago="${esc(g.end)}">${ago(g.end)}</div>
      </div>
      <div class="ibody">
        <div class="kicker">ACTIVITY · ${clips.length} CLIPS · ${cams.length} CAMERA${cams.length > 1 ? "S" : ""} · ${fmtDur((ge - gs) / 1000)}
          ${g.open ? '<span class="badge trk">● TRACKING</span>' : ""}
          ${g.continued_from ? `<a class="badge cont" data-day="${esc(g.continued_from)}">◂ CONTINUED FROM ${esc(weekday(g.continued_from).toUpperCase())}</a>` : ""}</div>
        <div class="ipath">${path}</div>
        <div class="lanes">${lanes}<div class="axis"><span>${t0.hm}:${t0.s}</span><span>${t1.hm}:${t1.s}</span></div></div>
      </div>
      <div class="actions">
        <button class="btn" data-seqplay>${ICON.play} PLAY SEQUENCE</button>
        <button class="btn ghost" data-links>${ICON.scan} LINKS</button>
        <button class="btn alt" data-expand>${expanded ? "▴ COLLAPSE" : "▾ CLIPS"}</button>
      </div>
    </div>
    <div class="strip">${strip}</div>
    <div class="isum">${lines}${tags ? `<div class="tags">${tags}</div>` : ""}<div class="notif">${notif}</div></div>
    <div class="members"></div>`;
  const members = el.querySelector(".members");
  xs.forEach(x => members.appendChild(x.el));
  el.querySelectorAll("[data-seq]").forEach(b => b.onclick = () => playSequence(g, b.dataset.seq));
  el.querySelector("[data-seqplay]").onclick = () => playSequence(g);
  el.querySelector("[data-links]").onclick = () => activityAnalysis(g);
  el.querySelector("[data-expand]").onclick = ev => {
    const on = el.classList.toggle("expanded");
    ev.currentTarget.textContent = on ? "▴ COLLAPSE" : "▾ CLIPS";
  };
  el.querySelector(".more")?.addEventListener("click", () => el.querySelector("[data-expand]").click());
  el.querySelector(".cont")?.addEventListener("click", ev => go(ev.currentTarget.dataset.day));
  return el;
}

// ---------- incoming (live view) ----------
// Clips still in the pipeline (server: incoming.py), above the feed: the raw
// video while processing, the processed one once it is ready (awaiting the
// notification). A discarded clip is stamped and switched off; one that reaches
// the events list hands over to its event row.
const INC_STEPS = { queued: "QUEUE", analyze: "ANALYZE", trim: "TRIM", frames: "FRAMES", describe: "DESCRIBE", save: "SAVE", notify: "NOTIFY" };
async function loadIncoming(first) {
  let data;
  try { data = await api(`/api/incoming/${state.date}`); } catch { return; }
  if (state.mode !== "live" || data.date !== state.date) return;
  const list = $("#incList"), seen = new Set();
  for (const it of data.items) {
    if (state.events.has(it.id) || state.incGone.has(it.id)) continue;
    seen.add(it.id);
    const known = state.inc.get(it.id), json = JSON.stringify(it);
    if (!known) {
      if (it.stage === "ignored" && first) { state.incGone.add(it.id); continue; }  // dropped before the page opened
      const x = { it, json, el: renderIncoming(it) };
      if (!first) x.el.classList.add("fresh");
      state.inc.set(it.id, x);
      const after = [...state.inc.values()].filter(o => o !== x && o.el.isConnected && (o.it.recorded_at || "") < (it.recorded_at || ""))
        .sort((a, b) => (b.it.recorded_at || "").localeCompare(a.it.recorded_at || ""))[0];
      list.insertBefore(x.el, after ? after.el : null);
      if (it.stage === "ignored") incDiscard(x);
    } else if (known.json !== json && !known.leaving) {
      known.it = it; known.json = json; updateIncoming(known);
      if (it.stage === "ignored") incDiscard(known);
    }
  }
  for (const [id, x] of state.inc) {
    if (x.leaving || seen.has(id)) continue;
    if (state.landing.has(id)) incMorph(x);  // reached the events list: the card moves into its place
    else incLeave(x, "landed");             // left the pipeline
  }
  incCount();
}
function incCount() {
  const n = [...state.inc.values()].filter(x => !x.leaving).length;
  $("#incN").textContent = n ? `· ${n} IN PIPELINE` : "";
  $("#incoming").classList.toggle("show", state.inc.size > 0);
}
function incEvent(it) {  // the shape play() expects
  const folder = p => p ? p.slice(0, p.lastIndexOf("/")) : null, file = p => p ? p.slice(p.lastIndexOf("/") + 1) : null;
  return { event_id: it.id, camera: it.camera, recorded_at: it.recorded_at, summary: { description: it.description },
    original: it.raw ? { folder: folder(it.raw), video_file: file(it.raw) } : null,
    processed: it.processed ? { folder: folder(it.processed), video_file: file(it.processed) } : null, video: it.processed };
}
function renderIncoming(it) {
  const el = document.createElement("article");
  el.className = "inc panel cut";
  el.id = "inc-" + it.id;
  const t = tparts(it.recorded_at);
  el.innerHTML = `
    <div class="when"><div class="time">${t.hm}<span class="sec">:${t.s}</span></div>
      <div class="cam">${esc(it.camera)}</div><div class="ago" data-ago="${esc(it.recorded_at)}">${ago(it.recorded_at)}</div></div>
    <div class="thumb" data-incplay><span class="scanbar"></span><span class="src"></span>
      <span class="corner tl"></span><span class="corner tr"></span><span class="corner bl"></span><span class="corner br"></span><span class="play"></span></div>
    <div class="body"><div class="stage-t"><span data-label></span><span class="tm" data-tm></span></div>
      <div class="stage-d" data-detail></div>
      <div class="tags" data-tags></div>
      <div class="pipe">${it.steps.map(s => `<span data-step="${s}">${INC_STEPS[s] || s.toUpperCase()}</span>`).join("")}</div>
      <div class="desc" data-desc></div></div>
    <div class="actions"><button class="btn" data-incplay>${ICON.play} PLAY</button></div>
    <div class="stampx"><div><b>DISCARDED</b><small data-why></small></div></div>`;
  const x = { it, el };
  el.querySelectorAll("[data-incplay]").forEach(b => b.onclick = () => {
    const cur = state.inc.get(it.id)?.it || it;
    play(incEvent(cur), cur.processed ? "processed" : "original");
  });
  updateIncoming(x, el);
  return el;
}
function updateIncoming(x, el = x.el) {
  const it = x.it, done = it.stage === "notify";
  el.classList.toggle("done", done);
  el.classList.toggle("stalled", !!it.stalled);
  el.querySelector("[data-label]").textContent = it.label + (it.stalled ? " · STALLED" : "");
  el.querySelector("[data-detail]").textContent = it.detail || "";
  el.querySelector("[data-desc]").textContent = it.description || "";
  const tags = (it.tags || []).map(t => t.kind === "person"
    ? `<span class="tag person"><i></i>${esc(t.text)} detected<span class="by">${esc((t.src || []).join(" + "))}</span></span>`
    : `<span class="tag ${t.kind === "trigger" ? "trigger" : "label"}">${t.kind === "trigger" ? "" : "#"}${esc(t.text)}</span>`).join("");
  const tbox = el.querySelector("[data-tags]");
  if (tbox.dataset.html !== tags) { tbox.dataset.html = tags; tbox.innerHTML = tags; }
  el.querySelector("[data-tm]").dataset.since = it.since_ms || "";
  el.querySelector("[data-tm]").dataset.queued = it.queued_ms || "";
  const cur = it.step ?? -1;
  el.querySelectorAll("[data-step]").forEach((s, i) => { s.classList.toggle("ok", i < cur); s.classList.toggle("cur", i === cur); });
  // media: the raw video while processing; the processed one (thumbnail + clip) once ready
  const box = el.querySelector(".thumb"), want = it.processed || it.raw, kind = it.processed ? "pro" : "raw";
  if (want && box.dataset.src !== want) {
    box.dataset.src = want;
    const v = document.createElement("video");
    Object.assign(v, { muted: true, loop: true, autoplay: true, playsInline: true, preload: "auto" });
    v.className = kind === "raw" ? "raw" : "";
    if (it.thumbnail) v.poster = media(it.thumbnail);
    v.style.opacity = "0";
    v.src = media(want);
    v.onloadeddata = () => {  // crossfade over the previous video
      v.style.opacity = "1";
      box.querySelectorAll("video").forEach(o => { if (o !== v) setTimeout(() => o.remove(), 650); });
    };
    box.insertBefore(v, box.firstChild);
    const lbl = box.querySelector(".src");
    lbl.className = "src " + (kind === "raw" ? "rawl" : "prol");
    lbl.textContent = kind === "raw" ? "RAW" : "PROCESSED";
  }
  incTimes(el);
}
function incTimes(el) {
  const tm = el.querySelector("[data-tm]"), since = +tm.dataset.since, queued = +tm.dataset.queued;
  if (!since) { tm.textContent = ""; return; }
  const mmss = ms => { const sec = Math.max(0, Math.round(ms / 1000)); return `${String(Math.floor(sec / 60)).padStart(2, "0")}:${String(sec % 60).padStart(2, "0")}`; };
  tm.textContent = `${mmss(Date.now() - since)}${queued && queued < since ? ` · total ${mmss(Date.now() - queued)}` : ""}`;
}
setInterval(() => state.inc.forEach(x => { if (!x.leaving) incTimes(x.el); }), 1000);
function incDiscard(x) {
  if (x.leaving) return;
  x.leaving = true;
  state.incGone.add(x.it.id);
  x.el.querySelector("[data-why]").textContent = x.it.detail || "";
  x.el.classList.add("discard");
  setTimeout(() => incLeave(x, "vanish", true), 2600);
  incCount();
}
function incLeave(x, how, already = false) {
  if (x.leaving && !already) return;
  x.leaving = true;
  state.incGone.add(x.it.id);
  const el = x.el;
  el.classList.add(how);
  el.addEventListener("animationend", function done(ev) {
    if (ev.target !== el || ev.animationName !== how) return;  // not a child's / an earlier animation
    el.removeEventListener("animationend", done);
    el.style.height = el.offsetHeight + "px";
    void el.offsetHeight;
    el.classList.add("gone");
    el.querySelectorAll("video").forEach(v => v.pause());
    setTimeout(() => { el.remove(); state.inc.delete(x.it.id); incCount(); }, 380);
  });
  incCount();
}

// One transition from pipeline to feed: the card leaves the pipeline list (its
// space closing behind it) and glides onto the event's row, or onto its activity
// card when stitched (followed live as the feed moves), then hands over to it.
function landTarget(id) {
  const u = state.units.get(state.memberOf.get(id)), ev = state.events.get(id);
  return u && !u.el.classList.contains("expanded") ? u.el : ev?.el;
}
function incMorph(x) {
  x.leaving = true;
  const id = x.it.id, el = x.el;
  const reveal = () => {
    state.landing.delete(id);
    const t = landTarget(id);
    [state.events.get(id)?.el, state.units.get(state.memberOf.get(id))?.el].forEach(n => n?.classList.remove("landing"));
    if (t) { t.classList.remove("arrived", "fresh", "flash"); void t.offsetWidth; t.classList.add("arrived"); }
  };
  const t0 = landTarget(id);
  if (!el.isConnected || !t0 || !t0.offsetParent) { reveal(); incLeave(x, "landed", true); return; }  // filtered out: no place to go
  const from = el.getBoundingClientRect();
  const ph = document.createElement("div");
  ph.className = "inc-ph"; ph.style.height = from.height + "px";
  el.replaceWith(ph); document.body.appendChild(el);
  el.classList.remove("fresh"); el.classList.add("flying");
  Object.assign(el.style, { left: from.left + "px", top: from.top + "px", width: from.width + "px", height: from.height + "px" });
  el.querySelectorAll("video").forEach(v => v.play().catch(() => {}));
  void ph.offsetHeight; ph.style.height = "0px"; ph.style.marginTop = "-10px";
  incCount();
  const start = performance.now(), D = 900, ease = k => k < .5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2;
  const step = now => {
    const k = Math.min(1, (now - start) / D), e = ease(k), t = landTarget(id);
    const to = t && t.offsetParent ? t.getBoundingClientRect() : from;
    const at = (a, b) => a + (b - a) * e + "px";
    Object.assign(el.style, { left: at(from.left, to.left), top: at(from.top, to.top), width: at(from.width, to.width), height: at(from.height, to.height) });
    if (k < 1) return requestAnimationFrame(step);
    reveal();
    el.style.opacity = "0";
    setTimeout(() => { el.querySelectorAll("video").forEach(v => v.pause()); el.remove(); ph.remove(); state.inc.delete(id); incCount(); }, 300);
  };
  requestAnimationFrame(step);
}

function dayRollover(today) {
  state.cfg.today = today;
  toast(`NEW DAY · ${today} — LIVE VIEW SWITCHED`);
  loadDays();
  history.replaceState(null, "", "#/live");
  open("live", today);
}

// The security mode the clips were processed in: "residents home" for a clip saved
// without description (fast), else the mode when it was not normal.
function securityTags(evs) {
  if (evs.some(e => e.fast)) return ['<span class="tag secmode home">⌂ residents home</span>'];
  const modes = [...new Set(evs.map(e => e.security_mode).filter(m => m && m !== "normal"))];
  return modes.map(m => `<span class="tag secmode">⌂ ${esc(m)}</span>`);
}

function renderEvent(e) {
  const s = e.summary || {}, n = e.notification, lvl = sev(e);
  const t = tparts(e.recorded_at);
  const el = document.createElement("article");
  el.className = `event panel cut ${n?.decision === "send" ? "sent" : n ? "skip" : ""} ${lvl !== "none" ? lvl : ""}`;
  el.id = "ev-" + e.event_id;
  el.dataset.id = e.event_id;

  const tags = [
    ...securityTags([e]),
    ...(lvl !== "none" ? [`<span class="tag ${lvl}">${lvl === "threat" ? "▲ THREAT" : "◆ SUSPICIOUS"}</span>`] : []),
    ...(s.people_types || []).map(p => `<span class="tag person">${esc(p.replace(/_/g, " "))}</span>`),
    ...(s.actions || []).map(a => `<span class="tag action">${esc(a.replace(/_/g, " "))}</span>`),
    ...(s.labels || []).map(l => `<span class="tag label">#${esc(l)}</span>`),
    ...((s.threat || {}).signals || []).map(l => `<span class="tag label">!${esc(l)}</span>`),
  ].join("");
  const people = (s.people || []).map(p =>
    `<div><b>${esc(p.appearance || p.type)}</b>${p.appearance_details ? " — " + esc(p.appearance_details) : ""}${p.estimated_age ? ` · ~${p.estimated_age}y` : ""}</div>`).join("")
    + (s.vehicles || []).map(v => `<div><b>⛟ ${esc(v.appearance)}</b>${v.appearance_details ? " — " + esc(v.appearance_details) : ""}</div>`).join("");

  let notif;
  if (e.fast) notif = `<span class="badge home">HOME</span><span class="msg skip">saved without analysis or notification (residents home)</span>`;
  else if (!n) notif = `<span class="badge wait">ANALYZING</span><span class="msg skip">awaiting notification decision…</span>`;
  else if (n.decision === "send") notif = `<span class="badge ${n.sent_at ? "sent" : "pending"}">${n.sent_at ? "SENT" : "QUEUED"}${n.tone ? " · " + esc(n.tone).toUpperCase() : ""}</span><span class="msg">${esc(n.message)}</span>`;
  else notif = `<span class="badge skip">SUPPRESSED</span><span class="msg skip">${esc(n.skip_reason)}</span>`;

  const tr = e.track;
  const track = tr && (tr.same_as || []).length ? `<div class="track">⌁ SAME SUBJECT AS ${tr.same_as.map(id => {
      const m = /(\d{4}-\d\d-\d\d)-(\d\d)-(\d\d)-(\d\d)-?(.*)/.exec(id) || [];
      return `<a data-jump="${esc(id)}">${m[2] ? `${m[2]}:${m[3]}` : esc(id)}${m[5] ? " " + esc(m[5].replace(/_/g, " ").toLowerCase()) : ""}</a>`;
    }).join("")}${tr.subject ? `<span> · ${esc(tr.subject)}</span>` : ""}</div>` : "";

  el.innerHTML = `
    <div class="when">
      <div class="time">${t.hm}<span class="sec">:${t.s}</span></div>
      <div class="cam">${esc(e.camera || "camera")}</div>
      <div class="ago" data-ago="${esc(e.recorded_at)}">${ago(e.recorded_at)}</div>
    </div>
    <div class="thumb" data-play="processed">
      ${e.thumbnail ? `<img loading="lazy" src="${media(e.thumbnail)}" alt="">` : '<div class="noimg">NO SIGNAL</div>'}
      <span class="corner tl"></span><span class="corner tr"></span><span class="corner bl"></span><span class="corner br"></span>
      <span class="play"></span><span class="rec">● REC ${t.hm}</span>
    </div>
    <div class="body">
      <div class="desc">${esc(s.description || "(no description)")}</div>
      ${tags ? `<div class="tags">${tags}</div>` : ""}
      ${(s.threat || {}).evidence ? `<div class="threatline ${lvl}">${esc(s.threat.evidence)}</div>` : ""}
      ${people ? `<div class="people">${people}</div>` : ""}
      <div class="notif">${notif}</div>
      ${track}
    </div>
    <div class="actions">
      <button class="btn" data-play="processed">${ICON.play} PLAY</button>
      <button class="btn ghost" data-analyze ${e.metadata ? "" : "disabled"}>${ICON.scan} ANALYSIS</button>
    </div>`;

  el.querySelectorAll("[data-play]").forEach(b => b.onclick = () => play(e, b.dataset.play));
  el.querySelector("[data-analyze]").onclick = () => analyze(e);
  el.querySelectorAll("[data-jump]").forEach(a => a.onclick = () => jumpTo(a.dataset.jump));
  return el;
}

function play(e, which) {
  const path = videoPath(e, which);
  if (!path) return;
  closePlayer();
  const p = $("#player"), t = tparts(e.recorded_at);
  p.innerHTML = `<div class="frame cut"><div class="ptitle"><span class="src ${which === "original" ? "orig" : ""}">${which === "original" ? "ORIGINAL · FULL CLIP" : "PROCESSED · TRIMMED"}</span>
      <span class="ev">${t.hm}:${t.s} · ${esc(e.camera || "camera")}</span>
      <span class="path">${esc(path)}</span>
      <button class="btn x" data-close>✕</button></div>
    <div class="screen"><video controls autoplay playsinline preload="metadata" src="${media(path)}"></video>

  const last = ev.length ? ev.reduce((a, b) => (a.recorded_at > b.recorded_at ? a : b)) : null;
  const pct = ev.length ? Math.round(sent / ev.length * 100) : 0;
  $("#stats").innerHTML = `
    <div class="stat panel cut"><div class="k">Events</div><div class="v c">${ev.length}</div><div class="bar"><i style="width:100%"></i></div></div>
    <div class="stat panel cut"><div class="k">Alerts sent</div><div class="v">${sent}</div><div class="bar"><i style="width:${pct}%"></i></div></div>
    <div class="stat panel cut"><div class="k">Suppressed</div><div class="v">${skip}</div><div class="bar"><i style="width:${ev.length ? Math.round(skip / ev.length * 100) : 0}%"></i></div></div>
    <div class="stat panel cut"><div class="k">Threat / suspicious</div><div class="v ${thr + sus ? "r" : "g"}">${thr} / ${sus}</div><div class="bar"><i style="width:${ev.length ? Math.round((thr + sus) / ev.length * 100) : 0}%;background:var(--red)"></i></div></div>
    <div class="stat panel cut"><div class="k">Cameras active</div><div class="v">${cams}</div><div class="bar"><i style="width:${Math.min(100, cams / Math.max(1, (state.cfg.cameras || []).length) * 100)}%"></i></div></div>
    <div class="stat panel cut"><div class="k">Last event</div><div class="v s">${last ? tparts(last.recorded_at).hm + " · " + esc(last.camera || "") : "—"}</div></div>`;
}

// ---------- live polling & autoscroll ----------
function startPoll() { state.pollTimer = setInterval(() => loadEvents(false), (state.cfg.poll_sec || 3) * 1000); }
function stopPoll() { clearInterval(state.pollTimer); state.pollTimer = null; }
const nearTop = () => window.scrollY <= 160;
function scrollTop(smooth = true) { window.scrollTo({ top: 0, behavior: smooth ? "smooth" : "auto" }); state.unseen = 0; $("#jump").classList.remove("show"); }
function onNew(n) {
  const v = document.querySelector("#player.open video");
  const playing = state.seq ? state.seq.playing : v && !v.paused;
  if (state.auto && !playing) setTimeout(() => scrollTop(true), 60);
  else { state.unseen += n; $("#jump").textContent = `▲ ${state.unseen} NEW EVENT${state.unseen > 1 ? "S" : ""}`; $("#jump").classList.add("show"); }
}
let lastY = 0;
window.addEventListener("scroll", () => {
  if (state.mode !== "live") return;
  const y = window.scrollY;
  if (y > lastY + 30 && !nearTop() && state.auto) setAuto(false);         // user scrolled down: pause following
  else if (nearTop() && !state.auto && y < lastY) setAuto(true);          // back at the top: follow again
  if (nearTop()) { state.unseen = 0; $("#jump").classList.remove("show"); }
  lastY = y;
}, { passive: true });
function setAuto(on) { state.auto = on; $("#tAuto").classList.toggle("on", on); }
$("#jump").onclick = () => { setAuto(true); scrollTop(true); };
setInterval(() => document.querySelectorAll("[data-ago]").forEach(a => a.textContent = ago(a.dataset.ago)), 30000);
